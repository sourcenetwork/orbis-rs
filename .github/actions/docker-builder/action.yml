name: Set up cached Docker builds
description: Use the Docker Hub cache for daemon and BuildKit image pulls.
runs:
  using: composite
  steps:
    - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
      with:
        daemon-config: |
          {
            "registry-mirrors": ["https://mirror.gcr.io"]
          }
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
