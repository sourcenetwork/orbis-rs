---
name: "Build and Test"
on: ["push"]

jobs: 
 build:
  runs-on: ubuntu-latest 
  steps: 
    - name: Checkout
    - uses: actions/checkout@v2

    - name: Run build
    - run: |
      cargo build

  build:
    runs-on: ubuntu-latest 
    steps: 
      - name: Checkout
      - uses: actions/checkout@v2

      - name: Run tests
      - run: |
        cargo test
  
