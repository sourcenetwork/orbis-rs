name: Rust

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # `image` job pushes the integration image to GHCR

# A newer push to the same branch / PR cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Run-scoped GHCR tag for the integration image. Passed to the sharded
  # `integration` jobs by registry rather than artifact — artifact v4 doesn't
  # work on the runs-on.com spot runners.
  INTEG_IMAGE: ghcr.io/${{ github.repository }}/node-integration
  # Incremental compilation has no upside on ephemeral CI runners (the cache we
  # restore doesn't carry target/debug/incremental) and adds codegen overhead.
  CARGO_INCREMENTAL: "0"
  # `local-storage` derives its at-rest key with Argon2id at ~256 MiB / t=3 by
  # default (see StoredKdfParams::for_new_db). The test suite makes ~150
  # LocalStorageImpl::new calls, so run it with trivial KDF cost. The released
  # binary is built by docker/Dockerfile and never sees these vars, so it keeps
  # the strong default.
  ORBIS_LOCAL_STORAGE_KDF_M_COST_KIB: "8"
  ORBIS_LOCAL_STORAGE_KDF_T_COST: "1"
  # The Docker/Vera integration tests — everything that shells out to
  # `docker compose`. Run in their own sharded `integration` job; the `unit`
  # job runs the complement. Validate with `cargo nextest list -E "<this>"`.
  DOCKER_TESTS: >-
    binary(blockchain_vera)
    | (package(authz) & test(/^vera::tests::/))
    | (package(bulletin) & test(/^vera::tests::/))
    | (package(orbis-node) & (test(/^tests::concurrent::/)
    | test(/^tests::reporting::/)
    | test(/^tests::fault_injection::/)
    | test(/^tests::integration::/)
    | test(/^tests::upgrade::/)
    | test(/^tests::cancel_ring_reshare::/)
    | test(/^tests::pending_ring_cancellation::/)
    | test(/^unsafe_testing::tests::/)))

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo registry / index
      uses: Swatinem/rust-cache@v2
      with:
        key: lint
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Install cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - name: Check licences
      run: cargo deny check
    # jubjub-wasm is consumed only as a compiled wasm32-unknown-unknown binary
    # (vendored into the separate vera repo, see crates/jubjub-wasm/README.md)
    # — nothing else in this workflow builds for that target, so a dependency
    # bump that silently breaks it (e.g. pulling in `getrandom` unconditionally)
    # would otherwise go unnoticed until someone manually rebuilds to ship.
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Build jubjub-wasm for wasm32-unknown-unknown
      run: cargo build --release --target wasm32-unknown-unknown -p jubjub-wasm

  clippy:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test,fault-injection,scale-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Clippy (${{ matrix.crypto }})
      run: cargo clippy --all-targets ${{ matrix.cargo_flags }} -- -D warnings

  native:
    name: Native backend (${{ matrix.crypto }})
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: native-${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Check native dependency boundary
      run: |
        cargo tree --locked --color never -p orbis-node --no-default-features --features native,redb,iroh,${{ matrix.crypto }} --edges normal,build --prefix none > "$RUNNER_TEMP/native-dependencies.txt"
        if grep -E '^(cosmrs|tendermint(-rpc|-config|-proto)?|cosmos-sdk-proto) v' "$RUNNER_TEMP/native-dependencies.txt"; then
          echo "Native node includes Cosmos transport dependencies"
          exit 1
        fi
    - name: Check native node and bulletin
      run: |
        cargo clippy --locked -p orbis-node -p bulletin --lib --bins --no-default-features --features native,redb,iroh,${{ matrix.crypto }} -- -D warnings
    - name: Compile native lifecycle scenarios
      run: cargo test --locked -p orbis-node --no-default-features --features native,redb,iroh,${{ matrix.crypto }} --test native_startup --no-run
    - name: Check bootstrap handoff, shutdown and identity storage
      run: |
        cargo test --locked -p common --no-default-features --lib node_signing
        cargo test --locked -p orbis-node --no-default-features --features native,redb,iroh,${{ matrix.crypto }} --lib bootstrap
        cargo test --locked -p orbis-node --no-default-features --features native,redb,iroh,${{ matrix.crypto }} --lib native_identity_preserves_existing_keys_and_refuses_corruption
        cargo test --locked -p bulletin --no-default-features --features native,${{ matrix.crypto }} --lib native::

  # Build the orbis-node integration image once and push it to GHCR (cargo-chef
  # in docker/Dockerfile keeps the dependency compile a cached layer). The
  # `integration` shards pull it and reuse it via ORBIS_INTEGRATION_IMAGE instead
  # of `docker compose up --build`.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
        backend: [cosmos, native]
        include:
          - backend: cosmos
            image_suffix: ""
            integration_features: "true"
            rust_image: rust:latest
          - backend: native
            image_suffix: "-native"
            integration_features: "false"
            rust_image: rust:1.98.0-bookworm
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build + push integration image (${{ matrix.crypto }})
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ env.INTEG_IMAGE }}:${{ github.sha }}${{ matrix.image_suffix }}-${{ matrix.crypto }}
        build-args: |
          ENABLE_INTEGRATION_TEST=${{ matrix.integration_features }}
          BACKEND=${{ matrix.backend }}
          RUST_IMAGE=${{ matrix.rust_image }}
          CRYPTO_FEATURE=${{ matrix.crypto }}
        cache-from: type=gha,scope=integ-${{ matrix.backend }}-${{ matrix.crypto }}
        cache-to: type=gha,scope=integ-${{ matrix.backend }}-${{ matrix.crypto }},mode=max
    - name: Build + push native fault-report image (${{ matrix.crypto }})
      if: matrix.backend == 'native'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        target: native-diagnostic
        push: true
        tags: ${{ env.INTEG_IMAGE }}:${{ github.sha }}-native-diagnostic-${{ matrix.crypto }}
        build-args: |
          ENABLE_INTEGRATION_TEST=false
          BACKEND=native
          RUST_IMAGE=${{ matrix.rust_image }}
          CRYPTO_FEATURE=${{ matrix.crypto }}
        cache-from: |
          type=gha,scope=integ-native-${{ matrix.crypto }}
          type=gha,scope=integ-native-diagnostic-${{ matrix.crypto }}
        cache-to: type=gha,scope=integ-native-diagnostic-${{ matrix.crypto }},mode=max

  # Compile every test binary once per crypto and save the shared cache the
  # `unit` / `integration` jobs restore.
  compile:
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test,fault-injection,scale-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: testbins-${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - name: Compile test binaries (${{ matrix.crypto }})
      run: cargo nextest run --no-run --profile ci ${{ matrix.cargo_flags }}

  unit:
    needs: compile
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test,fault-injection,scale-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: testbins-${{ matrix.crypto }}
        save-if: 'false'
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - name: Unit + in-process tests (${{ matrix.crypto }})
      run: cargo nextest run --profile ci ${{ matrix.cargo_flags }} -E "not (${{ env.DOCKER_TESTS }})"

  integration:
    needs: [compile, image]
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      ORBIS_INTEGRATION_CRYPTO: ${{ matrix.crypto }}
      ORBIS_INTEGRATION_IMAGE: orbis-node-integration:${{ matrix.crypto }}
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
        shard: ["1", "2", "3"]
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test,fault-injection,scale-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: testbins-${{ matrix.crypto }}
        save-if: 'false'
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Pull integration image
      run: |
        docker pull "$INTEG_IMAGE:${{ github.sha }}-${{ matrix.crypto }}"
        docker tag "$INTEG_IMAGE:${{ github.sha }}-${{ matrix.crypto }}" "$ORBIS_INTEGRATION_IMAGE"
    - name: Integration tests (${{ matrix.crypto }}, shard ${{ matrix.shard }}/3)
      run: >-
        cargo nextest run --profile ci ${{ matrix.cargo_flags }}
        -E "${{ env.DOCKER_TESTS }}"
        --partition count:${{ matrix.shard }}/3

  native-vera-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read matching native SDK revision
        id: vera
        run: echo "revision=$(python3 scripts/native-vera-ref.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native Vera image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.native-vera-integration
          push: true
          tags: ghcr.io/${{ github.repository }}/vera-native:${{ github.sha }}
          build-args: VERA_REF=${{ steps.vera.outputs.revision }}
          cache-from: type=gha,scope=native-vera
          cache-to: type=gha,scope=native-vera,mode=max

  native-lifecycle:
    name: Native lifecycle (${{ matrix.crypto }})
    needs: [image, native-vera-image]
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    env:
      ORBIS_NATIVE_IMAGE: ghcr.io/${{ github.repository }}/node-integration:${{ github.sha }}-native-${{ matrix.crypto }}
      ORBIS_NATIVE_DIAGNOSTIC_IMAGE: ghcr.io/${{ github.repository }}/node-integration:${{ github.sha }}-native-diagnostic-${{ matrix.crypto }}
      ORBIS_NATIVE_VERA_IMAGE: ghcr.io/${{ github.repository }}/vera-native:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler
      - name: Install qualified toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-lifecycle-${{ runner.os }}-${{ matrix.crypto }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: native-lifecycle-${{ runner.os }}-${{ matrix.crypto }}-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact native runtime images
        run: |
          docker pull "$ORBIS_NATIVE_IMAGE"
          docker pull "$ORBIS_NATIVE_VERA_IMAGE"
          docker pull "$ORBIS_NATIVE_DIAGNOSTIC_IMAGE"
      - name: Validate bounded diagnostic parser
        run: python3 scripts/test-native-lifecycle-unit.py
      - name: Native integration suite (${{ matrix.crypto }})
        run: bash scripts/test-native-integration.sh "${{ matrix.crypto }}"
