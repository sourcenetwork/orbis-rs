name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "bls12-381,redb"
            label: bls12-381
          - features: "decaf377,redb"
            label: decaf377

    name: build-test (${{ matrix.label }})

    steps:
    - uses: actions/checkout@v4

    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v0-rust-${{ matrix.label }}"

    - name: Build
      run: cargo build --no-default-features --features=${{ matrix.features }} --verbose

    - name: Run tests
      run: cargo test --no-default-features --features=${{ matrix.features }} --verbose

  build-e2e:
    runs-on: ubuntu-latest
    name: build-e2e

    steps:
    - uses: actions/checkout@v4

    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v0-rust-e2e"

    - name: Build orbis-node
      run: cargo build -p orbis-node --features integration-test,bls12-381,redb --verbose

    - name: Upload orbis-node binary
      uses: actions/upload-artifact@v4
      with:
        name: orbis-node
        path: target/debug/orbis-node
        if-no-files-found: error

  e2e-test:
    runs-on: ubuntu-latest
    needs: build-e2e
    name: e2e-test
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v0-rust-e2e"

    - name: Download orbis-node binary
      uses: actions/download-artifact@v4
      with:
        name: orbis-node
        path: target/debug

    - name: Make orbis-node executable
      run: chmod +x target/debug/orbis-node

    - name: Extract sourcehubd from Docker image
      run: |
        docker pull ghcr.io/sourcenetwork/sourcehub:dev
        id=$(docker create ghcr.io/sourcenetwork/sourcehub:dev)
        docker cp "$id:/usr/bin/sourcehubd" /usr/local/bin/sourcehubd
        docker rm "$id"
        sourcehubd version

    - name: Run e2e tests
      run: cargo test -p orbis-e2e -- --include-ignored --nocapture
