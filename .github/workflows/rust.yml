name: Rust

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Qualification scope
        type: choice
        options: [full, common, native, gateway, restart, threshold, fault]
        default: full
        required: true
      trust_revision:
        description: Immutable Trust native ring fixture revision for gateway scope
        type: string
        default: 11630c1a0b3241bed2799a6c162c4c8e16a4e502
      restart_curve:
        description: Curve for focused restart qualification
        type: choice
        options: [both, bls12-381, jubjub]
        default: both

      threshold_case:
        description: Case for focused threshold qualification
        type: choice
        options:
          - all
          - native_distributed_threshold_workflows
          - native_pet_threshold_workflows
          - native_pet_member_replacement
          - native_pet_scheduled_refresh_after_restart
          - native_defra_signing
        default: all

permissions:
  contents: read
  packages: write   # `image` job pushes the integration image to GHCR

# A newer push to the same branch / PR cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.scope == 'gateway' && '-native-trust' || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Run-scoped GHCR tag for the integration image. Passed to the sharded
  # `integration` jobs by registry rather than artifact — artifact v4 doesn't
  # work on the runs-on.com spot runners.
  INTEG_IMAGE: ghcr.io/${{ github.repository }}/node-integration
  # Incremental compilation has no upside on ephemeral CI runners (the cache we
  # restore doesn't carry target/debug/incremental) and adds codegen overhead.
  CARGO_INCREMENTAL: "0"
  # `local-storage` derives its at-rest key with Argon2id at ~256 MiB / t=3 by
  # default (see StoredKdfParams::for_new_db). The test suite makes ~150
  # LocalStorageImpl::new calls, so run it with trivial KDF cost. The released
  # binary is built by docker/Dockerfile and never sees these vars, so it keeps
  # the strong default.
  ORBIS_LOCAL_STORAGE_KDF_M_COST_KIB: "8"
  ORBIS_LOCAL_STORAGE_KDF_T_COST: "1"
  # The Docker/Vera integration tests — everything that shells out to
  # `docker compose`. Run in their own sharded `integration` job; the `unit`
  # job runs the complement. Validate with `cargo nextest list -E "<this>"`.
  DOCKER_TESTS: >-
    binary(blockchain_vera)
    | (package(authz) & test(/^vera::tests::/))
    | (package(bulletin) & test(/^vera::tests::/))
    | (package(orbis-node) & (test(/^tests::concurrent::/)
    | test(/^tests::reporting::/)
    | test(/^tests::fault_injection::/)
    | test(/^tests::integration::/)
    | test(/^tests::upgrade::/)
    | test(/^tests::cancel_ring_reshare::/)
    | test(/^tests::pending_ring_cancellation::/)
    | test(/^unsafe_testing::tests::/)))

jobs:
  common:
    name: Common backend boundary
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'common'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: common-backend-boundary
      - name: Qualify both Common feature modes
        run: bash scripts/test-common-backend.sh

  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo registry / index
      uses: Swatinem/rust-cache@v2
      with:
        key: lint
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Install cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - name: Check licences
      run: cargo deny check
    # jubjub-wasm is consumed only as a compiled wasm32-unknown-unknown binary
    # (vendored into the separate vera repo, see crates/jubjub-wasm/README.md)
    # — nothing else in this workflow builds for that target, so a dependency
    # bump that silently breaks it (e.g. pulling in `getrandom` unconditionally)
    # would otherwise go unnoticed until someone manually rebuilds to ship.
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Build jubjub-wasm for wasm32-unknown-unknown
      run: cargo build --release --target wasm32-unknown-unknown -p jubjub-wasm

  clippy:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test-cosmos,fault-injection,scale-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test-cosmos,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Clippy (${{ matrix.crypto }})
      run: cargo clippy --all-targets ${{ matrix.cargo_flags }} -- -D warnings

  native:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'native'
    name: Native backend (${{ matrix.crypto }})
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: native-${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Check native dependency boundary
      run: |
        cargo tree --locked --color never -p orbis-node --no-default-features --features native,redb,iroh,${{ matrix.crypto }} --edges normal,build --prefix none > "$RUNNER_TEMP/native-dependencies.txt"
        if grep -E '^(cosmrs|tendermint(-rpc|-config|-proto)?|cosmos-sdk-proto) v' "$RUNNER_TEMP/native-dependencies.txt"; then
          echo "Native node includes Cosmos transport dependencies"
          exit 1
        fi
    - name: Check native node and bulletin
      run: |
        cargo clippy --locked -p orbis-node -p bulletin --lib --bins --no-default-features --features native,redb,iroh,${{ matrix.crypto }} -- -D warnings
    - name: Compile native lifecycle scenarios
      run: cargo test --locked -p orbis-node --no-default-features --features native,redb,iroh,${{ matrix.crypto }} --test native_startup --no-run
    - name: Check bootstrap handoff, shutdown and identity storage
      run: |
        cargo test --locked -p common --no-default-features --lib node_signing
        cargo test --locked -p orbis-node --no-default-features --features native,redb,iroh,${{ matrix.crypto }} --lib bootstrap
        cargo test --locked -p orbis-node --no-default-features --features native,redb,iroh,${{ matrix.crypto }} --lib native_identity_preserves_existing_keys_and_refuses_corruption
        cargo test --locked -p bulletin --no-default-features --features native,${{ matrix.crypto }} --lib native::

  # Build the orbis-node integration image once and push it to GHCR (cargo-chef
  # in docker/Dockerfile keeps the dependency compile a cached layer). The
  # `integration` shards pull it and reuse it via ORBIS_INTEGRATION_IMAGE instead
  # of `docker compose up --build`.
  image:
    if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'common' && inputs.scope != 'restart' && inputs.scope != 'threshold' && inputs.scope != 'fault')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
        backend: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'gateway' || inputs.scope == 'native') && fromJSON('["native"]') || fromJSON('["cosmos", "native"]') }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: ./.github/actions/docker-builder
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build + push integration image (${{ matrix.crypto }})
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ env.INTEG_IMAGE }}:${{ github.sha }}${{ matrix.backend == 'native' && '-native' || '' }}-${{ matrix.crypto }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          io.sourcenetwork.orbis.backend=${{ matrix.backend }}
          io.sourcenetwork.orbis.curve=${{ matrix.crypto }}
          io.sourcenetwork.orbis.integration-features=${{ matrix.backend == 'native' && 'false' || 'true' }}
        build-args: |
          ENABLE_INTEGRATION_TEST=${{ matrix.backend == 'native' && 'false' || 'true' }}
          BACKEND=${{ matrix.backend }}
          RUST_IMAGE=${{ matrix.backend == 'native' && 'rust:1.98.0-bookworm' || 'rust:latest' }}
          CRYPTO_FEATURE=${{ matrix.crypto }}
        cache-from: type=gha,scope=integ-${{ matrix.backend }}-${{ matrix.crypto }}
        cache-to: type=gha,scope=integ-${{ matrix.backend }}-${{ matrix.crypto }},mode=max
    - name: Build + push native fault-report image (${{ matrix.crypto }})
      if: matrix.backend == 'native' && inputs.scope != 'gateway'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        target: native-diagnostic
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          io.sourcenetwork.orbis.backend=native
          io.sourcenetwork.orbis.curve=${{ matrix.crypto }}
          io.sourcenetwork.orbis.integration-features=false
          io.sourcenetwork.orbis.unsafe-testing=true
        push: true
        tags: ${{ env.INTEG_IMAGE }}:${{ github.sha }}-native-diagnostic-${{ matrix.crypto }}
        build-args: |
          ENABLE_INTEGRATION_TEST=false
          BACKEND=native
          RUST_IMAGE=${{ matrix.backend == 'native' && 'rust:1.98.0-bookworm' || 'rust:latest' }}
          CRYPTO_FEATURE=${{ matrix.crypto }}
        cache-from: |
          type=gha,scope=integ-native-${{ matrix.crypto }}
          type=gha,scope=integ-native-diagnostic-${{ matrix.crypto }}
        cache-to: type=gha,scope=integ-native-diagnostic-${{ matrix.crypto }},mode=max

  # Compile every test binary once per crypto and save the shared cache the
  # `unit` / `integration` jobs restore.
  compile:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test-cosmos,fault-injection,scale-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test-cosmos,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: testbins-${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - name: Compile test binaries (${{ matrix.crypto }})
      run: cargo nextest run --no-run --profile ci ${{ matrix.cargo_flags }}

  unit:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    needs: compile
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test-cosmos,fault-injection,scale-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test-cosmos,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: testbins-${{ matrix.crypto }}
        save-if: 'false'
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - name: Unit + in-process tests (${{ matrix.crypto }})
      run: cargo nextest run --profile ci ${{ matrix.cargo_flags }} -E "not (${{ env.DOCKER_TESTS }})"

  integration:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    needs: [compile, image]
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      ORBIS_INTEGRATION_CRYPTO: ${{ matrix.crypto }}
      ORBIS_INTEGRATION_IMAGE: orbis-node-integration:${{ matrix.crypto }}
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
        shard: ["1", "2", "3"]
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test-cosmos,fault-injection,scale-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test-cosmos,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: testbins-${{ matrix.crypto }}
        save-if: 'false'
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Pull integration image
      run: |
        docker pull "$INTEG_IMAGE:${{ github.sha }}-${{ matrix.crypto }}"
        docker tag "$INTEG_IMAGE:${{ github.sha }}-${{ matrix.crypto }}" "$ORBIS_INTEGRATION_IMAGE"
    - name: Integration tests (${{ matrix.crypto }}, shard ${{ matrix.shard }}/3)
      run: >-
        cargo nextest run --profile ci ${{ matrix.cargo_flags }}
        -E "${{ env.DOCKER_TESTS }}"
        --partition count:${{ matrix.shard }}/3

  native-vera-image:
    if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'common' && inputs.scope != 'restart' && inputs.scope != 'threshold' && inputs.scope != 'fault')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned native Vera revision
        id: vera
        run: echo "revision=$(cat docker/NATIVE_VERA_REF)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docker-builder
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build native Vera image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.native-vera-integration
          push: true
          tags: ghcr.io/${{ github.repository }}/vera-native:${{ github.sha }}
          build-args: VERA_REF=${{ steps.vera.outputs.revision }}
          cache-from: type=gha,scope=native-vera
          cache-to: type=gha,scope=native-vera,mode=max

  native-lifecycle:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'native'
    name: Native lifecycle (${{ matrix.crypto }})
    needs: [image, native-vera-image]
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    env:
      ORBIS_NATIVE_IMAGE: ghcr.io/${{ github.repository }}/node-integration:${{ github.sha }}-native-${{ matrix.crypto }}
      ORBIS_NATIVE_DIAGNOSTIC_IMAGE: ghcr.io/${{ github.repository }}/node-integration:${{ github.sha }}-native-diagnostic-${{ matrix.crypto }}
      ORBIS_NATIVE_VERA_IMAGE: ghcr.io/${{ github.repository }}/vera-native:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev protobuf-compiler
      - name: Install qualified toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-lifecycle-${{ runner.os }}-${{ matrix.crypto }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: native-lifecycle-${{ runner.os }}-${{ matrix.crypto }}-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact native runtime images
        run: |
          docker pull "$ORBIS_NATIVE_IMAGE"
          docker pull "$ORBIS_NATIVE_VERA_IMAGE"
          docker pull "$ORBIS_NATIVE_DIAGNOSTIC_IMAGE"
      - name: Native integration suite (${{ matrix.crypto }})
        run: |
          cargo +1.98.0 nextest run --profile ci --release --locked --build-jobs 2 \
            -p orbis-node --no-default-features \
            --features "integration-test-native,redb,iroh,${{ matrix.crypto }}" \
            --test native_startup \
            -E "binary(native_startup) & not test(=native_trust_gateway_ring_dkg)"

  native-restart:
    name: Native ${{ inputs.scope }} (${{ matrix.crypto }})
    if: github.event_name == 'workflow_dispatch' && (inputs.scope == 'restart' || inputs.scope == 'threshold' || inputs.scope == 'fault')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        crypto: ${{ fromJSON(inputs.restart_curve == 'bls12-381' && '["bls12-381"]' || inputs.restart_curve == 'jubjub' && '["jubjub"]' || '["bls12-381", "jubjub"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libdbus-1-dev protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native-restart-${{ matrix.crypto }}
          cache-targets: true
          cache-on-failure: true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Qualify native lifecycle
        env:
          NATIVE_RESTART_CURVE: ${{ matrix.crypto }}
          NATIVE_RESTART_SUITE: ${{ inputs.scope }}
          NATIVE_LIFECYCLE_CASE: ${{ inputs.threshold_case }}
        run: python3 scripts/qualify-native-restart.py
      - name: Retain bounded lifecycle results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ inputs.scope }}-${{ matrix.crypto }}-results
          path: ${{ runner.temp }}/native-${{ inputs.scope }}-${{ matrix.crypto }}/results.json
          retention-days: 3
          if-no-files-found: warn

  native-trust-artifacts:
    name: Build native Trust ring artifacts once
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'gateway' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable fixture input
        env:
          TRUST_REVISION: ${{ inputs.trust_revision }}
        run: python3 scripts/native_trust_hosted.py validate --trust-ref "$TRUST_REVISION"
      - uses: actions/checkout@v4
        with:
          repository: sourcenetwork/trust-api
          ref: ${{ inputs.trust_revision }}
          path: .native/trust
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sourcenetwork/vera.rs
          ref: 1dab0c4562da551b1a7f00fcea643b914769891c
          path: .native/vera
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sourcenetwork/defradb.rs
          ref: 88e148a7387e00d9dd6fbf6ab78701d6e2bef452
          path: .native/defra
          persist-credentials: false
      - name: Install qualified native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libdbus-1-dev protobuf-compiler
          rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-trust-artifacts-${{ runner.os }}-88e148a7
      - uses: ./.github/actions/docker-builder
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate private orchestration guards
        run: python3 scripts/test-native-trust-hosted.py
      - name: Stage normal runtimes and focused Go driver
        env:
          TRUST_REVISION: ${{ inputs.trust_revision }}
          TRUST_IMAGE: ghcr.io/${{ github.repository }}/trust-native:${{ github.sha }}-${{ inputs.trust_revision }}
        run: |
          python3 scripts/native_trust_hosted.py build --trust-ref "$TRUST_REVISION" \
            --trust .native/trust --vera .native/vera --defra .native/defra \
            --image "$TRUST_IMAGE" --output "$RUNNER_TEMP/native-trust-build"
      - name: Transfer immutable binaries and hashes only
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: native-trust-artifacts-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-trust-build/native-trust-artifacts.tar
            ${{ runner.temp }}/native-trust-build/native-trust-artifacts.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native-trust-ring:
    name: Native Trust ring (${{ matrix.crypto }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'gateway' }}
    needs: [image, native-vera-image, native-trust-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    env:
      ORBIS_NATIVE_IMAGE: ghcr.io/${{ github.repository }}/node-integration:${{ github.sha }}-native-${{ matrix.crypto }}
      ORBIS_NATIVE_VERA_IMAGE: ghcr.io/${{ github.repository }}/vera-native:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install qualified native fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libdbus-1-dev protobuf-compiler
          rustup toolchain install 1.98.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-trust-ring-${{ runner.os }}-${{ matrix.crypto }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: native-trust-ring-${{ runner.os }}-${{ matrix.crypto }}-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.native-trust-artifacts.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/native-trust-download
      - name: Verify executable and container ring/DKG contracts
        env:
          TRUST_REVISION: ${{ inputs.trust_revision }}
        run: |
          python3 scripts/native_trust_hosted.py run --trust-ref "$TRUST_REVISION" \
            --curve "${{ matrix.crypto }}" --artifacts "$RUNNER_TEMP/native-trust-download" \
            --output "$RUNNER_TEMP/native-trust-run"
