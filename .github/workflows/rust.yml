name: Paired promotion qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      ORBIS_LOCAL_STORAGE_KDF_M_COST_KIB: "8"
      ORBIS_LOCAL_STORAGE_KDF_T_COST: "1"
      NATIVE_RESTART_CURVE: ${{ matrix.crypto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libdbus-1-dev protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: native-restart-${{ matrix.crypto }}
          cache-targets: true
          cache-on-failure: true
      - name: Reproduce delayed promotion on the previous implementation
        run: sh .github/scripts/qualify-paired-promotion.sh
      - name: Verify corrected cleanup and formatting
        run: |
          cargo test --locked -p orbis-node --no-default-features --features native,redb,iroh,${{ matrix.crypto }} --lib coordinator::reshare::cleanup::tests -- --test-threads=1
          cargo fmt --all --check
