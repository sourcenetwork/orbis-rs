name: Normal paired-promotion runtime images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  native-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-builder
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build normal native image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/node-integration:${{ github.sha }}-native-${{ matrix.crypto }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.sourcenetwork.orbis.backend=native
            io.sourcenetwork.orbis.curve=${{ matrix.crypto }}
            io.sourcenetwork.orbis.integration-features=false
          build-args: |
            ENABLE_INTEGRATION_TEST=false
            BACKEND=native
            RUST_IMAGE=rust:1.98.0-bookworm
            CRYPTO_FEATURE=${{ matrix.crypto }}
          cache-from: type=gha,scope=integ-native-${{ matrix.crypto }}
          cache-to: type=gha,scope=integ-native-${{ matrix.crypto }},mode=max
