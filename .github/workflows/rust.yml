name: Rust

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Qualification scope
        type: choice
        options: [full, common, vera, gateway, peer-recovery, vera-image]
        default: full
        required: true
      trust_revision:
        description: Immutable Trust native ring fixture revision for gateway scope
        type: string
        default: 8c3dfa70eee62f1b2d3d27cae7941ce4d6ed73d5

permissions:
  contents: read
  packages: write   # `image` job pushes the integration image to GHCR

# A newer push to the same branch / PR cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.scope == 'gateway' && '-vera-trust' || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Run-scoped GHCR tag for the integration image. Passed to the sharded
  # `integration` jobs by registry rather than artifact — artifact v4 doesn't
  # work on the runs-on.com spot runners.
  INTEG_IMAGE: ghcr.io/${{ github.repository }}/node-integration
  # Incremental compilation has no upside on ephemeral CI runners (the cache we
  # restore doesn't carry target/debug/incremental) and adds codegen overhead.
  CARGO_INCREMENTAL: "0"
  # `local-storage` derives its at-rest key with Argon2id at ~256 MiB / t=3 by
  # default (see StoredKdfParams::for_new_db). The test suite makes ~150
  # LocalStorageImpl::new calls, so run it with trivial KDF cost. The released
  # binary is built by docker/Dockerfile and never sees these vars, so it keeps
  # the strong default.
  ORBIS_LOCAL_STORAGE_KDF_M_COST_KIB: "8"
  ORBIS_LOCAL_STORAGE_KDF_T_COST: "1"
  # The Docker-backed integration tests. Run in their own sharded
  # `integration` job; the `unit` job runs the complement. Validate with
  # `cargo nextest list -E "<this>"`.
  DOCKER_TESTS: >-
    package(orbis-node) & (test(/^tests::e2e::/) | test(/^tests::node::/))

jobs:
  common:
    name: Common backend boundary
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'common'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: common-backend-boundary
      - name: Qualify both Common feature modes
        run: bash scripts/test-common-backend.sh

  lint:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
    - name: Cache cargo registry / index
      uses: Swatinem/rust-cache@v2
      with:
        key: lint
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Install cargo-deny
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
      with:
        tool: cargo-deny@0.20.2
    - name: Check licences
      run: cargo deny check
    # jubjub-wasm is consumed only as a compiled wasm32-unknown-unknown binary
    # (vendored into the separate vera repo, see crates/jubjub-wasm/README.md)
    # — nothing else in this workflow builds for that target, so a dependency
    # bump that silently breaks it (e.g. pulling in `getrandom` unconditionally)
    # would otherwise go unnoticed until someone manually rebuilds to ship.
    - name: Install wasm32 target
      run: rustup target add wasm32-unknown-unknown
    - name: Build jubjub-wasm for wasm32-unknown-unknown
      run: cargo build --release --target wasm32-unknown-unknown -p jubjub-wasm

  clippy:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --no-default-features --features=bls12-381,redb,integration-test,vera,test-support/vera,iroh,fault-injection,scale-testing,unsafe-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test,vera,test-support/vera,fault-injection,scale-testing,orbis-node
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Clippy (${{ matrix.crypto }})
      run: cargo clippy --all-targets ${{ matrix.cargo_flags }} -- -D warnings

  vera:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'vera'
    name: Vera backend (${{ matrix.crypto }})
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: vera-${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Check Vera dependency boundary
      run: bash scripts/check-vera-dependencies.sh "${{ matrix.crypto }}"
    - name: Check Vera node and bulletin
      run: |
        cargo clippy --locked -p orbis-node -p bulletin --lib --bins --no-default-features --features vera,redb,iroh,${{ matrix.crypto }} -- -D warnings
    - name: Check reshare participant selection
      run: cargo test --locked -p orbis-node --no-default-features --features vera,redb,iroh,${{ matrix.crypto }} --lib coordinator::reshare::selection::tests -- --test-threads=1
    - name: Check Vera authorization and revision anchors
      if: matrix.crypto == 'bls12-381'
      run: cargo test --locked -p authz --no-default-features --features vera --lib vera::tests -- --test-threads=1
    - name: Compile Vera lifecycle scenarios
      run: cargo test --locked -p orbis-node --no-default-features --features integration-test,vera,test-support/vera,redb,iroh,${{ matrix.crypto }} --lib --no-run
    - name: Check private Go failure diagnostics
      run: cargo test --locked -p orbis-node --no-default-features --features integration-test,vera,test-support/vera,redb,iroh,${{ matrix.crypto }} --lib trust_go_failure_
    - name: Check bootstrap handoff, shutdown and identity storage
      run: |
        cargo test --locked -p common --no-default-features --lib node_signing
        cargo test --locked -p orbis-node --no-default-features --features vera,redb,iroh,${{ matrix.crypto }} --lib bootstrap
        cargo test --locked -p bulletin --no-default-features --features vera --lib vera::

  # The `#[ignore]`d tests that run against a `verad` cluster: authz and
  # bulletin services, vera-admin, and orbis-node's in-process fault
  # injection. `verad` is built from the revision the SDK manifests pin.
  vera-native:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'vera'
    name: Native Vera services
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
      VERAD_BINARY: ${{ github.workspace }}/.native/vera/target/release/verad
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Read pinned Vera revision
      id: vera
      run: |
        revision="$(python3 scripts/vera-ref.py)"
        test "$revision" = "$(cat docker/VERA_REF)"
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: sourcenetwork/vera.rs
        ref: ${{ steps.vera.outputs.revision }}
        path: .native/vera
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: vera-native
        workspaces: |
          . -> target
          .native/vera -> target
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler lld clang libclang-dev cmake pkg-config libssl-dev
    - name: Build verad
      working-directory: .native/vera
      run: cargo build --release --locked -p verad --bin verad
    - name: Authorization service
      timeout-minutes: 15
      run: cargo test --locked -p authz --features vera --test vera_service -- --ignored --test-threads=1
    - name: Bulletin service
      timeout-minutes: 15
      run: cargo test --locked -p bulletin --features vera --test vera_service -- --ignored --test-threads=1
    - name: vera-admin
      timeout-minutes: 15
      run: cargo test --locked -p cli-tool --features vera --test vera_admin -- --ignored --test-threads=1
    - name: Fault injection
      timeout-minutes: 40
      env:
        RUST_LOG: info
        ORBIS_TEST_LOG_DIR: ${{ runner.temp }}/native-vera-logs
      run: >-
        cargo test --locked -p orbis-node --no-default-features
        --features integration-test,vera,test-support/vera,redb,iroh,bls12-381,fault-injection
        --lib fault_injection -- --ignored --test-threads=1
    - name: Keep verad logs of failed tests
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: native-vera-logs
        path: ${{ runner.temp }}/native-vera-logs
        if-no-files-found: ignore
        retention-days: 14

  # Build the orbis-node integration image once and push it to GHCR (cargo-chef
  # in docker/Dockerfile keeps the dependency compile a cached layer). The
  # `integration` shards pull it instead of building it themselves.
  image:
    if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'common' && inputs.scope != 'peer-recovery' && inputs.scope != 'vera-image')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: ./.github/actions/docker-builder
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build + push integration image (${{ matrix.crypto }})
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: ${{ env.INTEG_IMAGE }}:${{ github.sha }}-vera-${{ matrix.crypto }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          io.sourcenetwork.orbis.backend=vera
          io.sourcenetwork.orbis.curve=${{ matrix.crypto }}
          io.sourcenetwork.orbis.integration-features=false
        build-args: |
          ENABLE_INTEGRATION_TEST=false
          RUST_IMAGE=rust:1.99.1-bookworm
          CRYPTO_FEATURE=${{ matrix.crypto }}
        cache-from: type=gha,scope=integ-vera-${{ matrix.crypto }}
        cache-to: type=gha,scope=integ-vera-${{ matrix.crypto }},mode=max
    - name: Build + push Vera diagnostic image (${{ matrix.crypto }})
      if: inputs.scope != 'gateway'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        target: vera-diagnostic
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          io.sourcenetwork.orbis.backend=vera
          io.sourcenetwork.orbis.curve=${{ matrix.crypto }}
          io.sourcenetwork.orbis.integration-features=false
          io.sourcenetwork.orbis.unsafe-testing=true
        push: true
        tags: ${{ env.INTEG_IMAGE }}:${{ github.sha }}-vera-diagnostic-${{ matrix.crypto }}
        build-args: |
          ENABLE_INTEGRATION_TEST=false
          RUST_IMAGE=rust:1.99.1-bookworm
          CRYPTO_FEATURE=${{ matrix.crypto }}
        cache-from: |
          type=gha,scope=integ-vera-${{ matrix.crypto }}
          type=gha,scope=integ-vera-diagnostic-${{ matrix.crypto }}
        cache-to: type=gha,scope=integ-vera-diagnostic-${{ matrix.crypto }},mode=max

  # Compile every test binary once per crypto and save the shared cache the
  # `unit`/`integration` jobs restore. The integration run is release-mode, so
  # this warm-up builds in release too.
  compile:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-compile-${{ strategy.job-index }}/spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --no-default-features --features=integration-test,vera,test-support/vera,redb,iroh,bls12-381
          - crypto: jubjub
            cargo_flags: --no-default-features --features=integration-test,vera,test-support/vera,redb,iroh,jubjub
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: testbins-vera-${{ matrix.crypto }}
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler lld clang libclang-dev cmake pkg-config libssl-dev
    - name: Install cargo-nextest
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
      with:
        tool: cargo-nextest
    - name: Compile test binaries (${{ matrix.crypto }})
      run: cargo nextest run --no-run --profile ci -p orbis-node --release --locked --build-jobs 2 ${{ matrix.cargo_flags }}
    - name: Verify E2E inventory (${{ matrix.crypto }})
      # This compiles/discovers tests but never executes their bodies. The
      # sentinel assertions catch stale filters and cfg drift that `--no-run`
      # alone cannot detect, including scenarios disappearing from one crypto
      # build.
      run: bash scripts/check-e2e-inventory.sh --release --locked --build-jobs 2 ${{ matrix.cargo_flags }}

  unit:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full'
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-unit-${{ strategy.job-index }}/spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --no-default-features --features=bls12-381,redb,integration-test,vera,test-support/vera,iroh,fault-injection,scale-testing
          - crypto: jubjub
            cargo_flags: --no-default-features --features=jubjub,redb,integration-test,vera,test-support/vera,fault-injection,scale-testing,orbis-node
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: unit-${{ matrix.crypto }}
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler lld clang libclang-dev cmake pkg-config libssl-dev
    - name: Install cargo-nextest
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
      with:
        tool: cargo-nextest
    - name: Unit + in-process tests (${{ matrix.crypto }})
      run: cargo nextest run --profile ci ${{ matrix.cargo_flags }} -E "not (${{ env.DOCKER_TESTS }})"

  vera-image:
    if: github.event_name != 'workflow_dispatch' || (inputs.scope != 'common' && inputs.scope != 'peer-recovery')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned Vera revision
        id: vera
        run: echo "revision=$(cat docker/VERA_REF)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docker-builder
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Vera image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.vera-integration
          push: true
          tags: ghcr.io/${{ github.repository }}/vera:${{ github.sha }}
          build-args: VERA_REF=${{ steps.vera.outputs.revision }}
          cache-from: type=gha,scope=vera
          cache-to: type=gha,scope=vera,mode=max

  # Docker-backed integration pipeline: the `-p orbis-node --lib` E2E and
  # node tests (minus the gateway-only fixture test, which needs the separate
  # Trust-ring artifact pipeline — `scope == 'gateway'`), sharded 7-way with
  # nextest's `hash:` partitioning so a cluster of slow tests does not land in
  # one shard.
  integration:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'full' || inputs.scope == 'vera'
    name: Integration (${{ matrix.crypto }}, shard ${{ matrix.shard }}/7)
    needs: [compile, image, vera-image]
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-integration-${{ strategy.job-index }}/spot=false/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    timeout-minutes: 120
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
        shard: ["1", "2", "3", "4", "5", "6", "7"]
        include:
          - crypto: bls12-381
            cargo_flags: --no-default-features --features=integration-test,vera,test-support/vera,redb,iroh,bls12-381
          - crypto: jubjub
            cargo_flags: --no-default-features --features=integration-test,vera,test-support/vera,redb,iroh,jubjub
    steps:
    - name: Verify on-demand runner
      run: test "${RUNS_ON_INSTANCE_LIFECYCLE:-}" = on-demand
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: testbins-vera-${{ matrix.crypto }}
        save-if: 'false'
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y protobuf-compiler lld clang libclang-dev cmake pkg-config libssl-dev
    - name: Install cargo-nextest
      uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
      with:
        tool: cargo-nextest
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Pull Vera integration images
      run: |
        docker pull "$INTEG_IMAGE:${{ github.sha }}-vera-${{ matrix.crypto }}"
        docker pull "$INTEG_IMAGE:${{ github.sha }}-vera-diagnostic-${{ matrix.crypto }}"
        docker pull "ghcr.io/${{ github.repository }}/vera:${{ github.sha }}"
        {
          echo "ORBIS_VERA_NODE_IMAGE=$INTEG_IMAGE:${{ github.sha }}-vera-${{ matrix.crypto }}"
          echo "ORBIS_VERA_DIAGNOSTIC_IMAGE=$INTEG_IMAGE:${{ github.sha }}-vera-diagnostic-${{ matrix.crypto }}"
          echo "ORBIS_VERA_IMAGE=ghcr.io/${{ github.repository }}/vera:${{ github.sha }}"
        } >> "$GITHUB_ENV"
    - name: Integration tests (${{ matrix.crypto }}, shard ${{ matrix.shard }}/7)
      run: >-
        cargo nextest run --profile ci --retries 0 --no-tests fail -p orbis-node --release --locked --build-jobs 2 ${{ matrix.cargo_flags }}
        -E "(test(/^tests::e2e::/) & not test(=tests::e2e::vera_lifecycle::vera_trust_gateway_ring_dkg)) | test(/^tests::node::/)"
        --partition hash:${{ matrix.shard }}/7

  sign-peer-recovery:
    name: Signing peer recovery (${{ matrix.crypto }})
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'peer-recovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      QUALIFICATION_CURVE: ${{ matrix.crypto }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 3
          path: candidate
      - uses: dtolnay/rust-toolchain@d124f86f28ff42855784ff3319f48ac182c248f8 # 1.99.1
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libdbus-1-dev protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: native-restart-${{ matrix.crypto }}
          cache-on-failure: true
      - name: Fetch locked dependencies
        working-directory: candidate
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://${{ secrets.PRIVATE_REPO_PAT }}@github.com/sourcenetwork/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/sourcenetwork/
        run: cargo +1.99.1 fetch --locked
      - name: Reproduce and fix signing connection retention
        run: python3 scripts/qualify-sign-peer-recovery.py
      - name: Retain bounded regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sign-peer-recovery-${{ matrix.crypto }}
          path: ${{ runner.temp }}/sign-peer-recovery-${{ matrix.crypto }}/results.json
          if-no-files-found: warn
          retention-days: 14

  vera-trust-artifacts:
    name: Build native Trust ring artifacts once
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'gateway' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate immutable fixture input
        id: sources
        env:
          TRUST_REVISION: ${{ inputs.trust_revision }}
        run: python3 scripts/vera_trust_hosted.py validate --trust-ref "$TRUST_REVISION"
      - uses: actions/checkout@v4
        with:
          repository: sourcenetwork/trust-api
          ref: ${{ inputs.trust_revision }}
          path: .native/trust
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sourcenetwork/vera.rs
          ref: ${{ steps.sources.outputs.vera }}
          path: .native/vera
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: sourcenetwork/defradb.rs
          ref: ${{ steps.sources.outputs.defra }}
          path: .native/defra
          persist-credentials: false
      - name: Install qualified native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libdbus-1-dev protobuf-compiler
          rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: vera-trust-artifacts-${{ runner.os }}-${{ steps.sources.outputs.defra }}
      - uses: ./.github/actions/docker-builder
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate private orchestration guards
        run: python3 scripts/test-vera-trust-hosted.py
      - name: Stage normal runtimes and focused Go driver
        env:
          TRUST_REVISION: ${{ inputs.trust_revision }}
          TRUST_IMAGE: ghcr.io/${{ github.repository }}/trust-native:${{ github.sha }}-${{ inputs.trust_revision }}
        run: |
          python3 scripts/vera_trust_hosted.py build --trust-ref "$TRUST_REVISION" \
            --trust .native/trust --vera .native/vera --defra .native/defra \
            --image "$TRUST_IMAGE" --output "$RUNNER_TEMP/vera-trust-build"
      - name: Transfer immutable binaries and hashes only
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: vera-trust-artifacts-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vera-trust-build/vera-trust-artifacts.tar
            ${{ runner.temp }}/vera-trust-build/vera-trust-artifacts.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  vera-trust-ring:
    name: Native Trust ring (${{ matrix.crypto }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'gateway' }}
    needs: [image, vera-image, vera-trust-artifacts]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        crypto: [bls12-381, jubjub]
    env:
      ORBIS_VERA_NODE_IMAGE: ghcr.io/${{ github.repository }}/node-integration:${{ github.sha }}-vera-${{ matrix.crypto }}
      ORBIS_VERA_IMAGE: ghcr.io/${{ github.repository }}/vera:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install qualified native fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev libdbus-1-dev protobuf-compiler
          rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: vera-trust-ring-${{ runner.os }}-${{ matrix.crypto }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: vera-trust-ring-${{ runner.os }}-${{ matrix.crypto }}-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.vera-trust-artifacts.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/vera-trust-download
      - name: Verify executable and container ring/DKG contracts
        env:
          TRUST_REVISION: ${{ inputs.trust_revision }}
        run: |
          python3 scripts/vera_trust_hosted.py run --trust-ref "$TRUST_REVISION" \
            --curve "${{ matrix.crypto }}" --artifacts "$RUNNER_TEMP/vera-trust-download" \
            --output "$RUNNER_TEMP/vera-trust-run"
