name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache

    steps:
    - uses: actions/checkout@v4
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Pull SourceHub image
      run: docker pull ghcr.io/sourcenetwork/sourcehub:dev
    - name: Run tests
      run: cargo test --features=integration-test,fault-injection --verbose
    - name: Run tests decaf377
      run: cargo test --no-default-features --features=decaf377,redb,integration-test,fault-injection --verbose
