name: Rust

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

# A newer push to the same branch / PR cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation has no upside on ephemeral CI runners (the cache we
  # restore doesn't carry target/debug/incremental) and adds codegen overhead.
  CARGO_INCREMENTAL: "0"
  # `local-storage` derives its at-rest key with Argon2id at ~256 MiB / t=3 by
  # default (see StoredKdfParams::for_new_db). The test suite makes ~150
  # LocalStorageImpl::new calls, so run it with trivial KDF cost. The released
  # binary is built by docker/Dockerfile and never sees these vars, so it keeps
  # the strong default.
  ORBIS_LOCAL_STORAGE_KDF_M_COST_KIB: "8"
  ORBIS_LOCAL_STORAGE_KDF_T_COST: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo registry / index
      uses: Swatinem/rust-cache@v2
      with:
        key: lint
    - name: Install protoc
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Install cargo-deny
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - name: Check licences
      run: cargo deny check

  clippy:
    runs-on: ubuntu-latest
    # lld cuts link time on a tree this size; only affects Linux CI.
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test,fault-injection,scale-testing
          - crypto: decaf377
            cargo_flags: --no-default-features --features=decaf377,redb,integration-test,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Clippy (${{ matrix.crypto }})
      run: cargo clippy --all-targets ${{ matrix.cargo_flags }} -- -D warnings

  build:
    runs-on: runs-on=${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}/\
      spot=pco/cpu=16+32/family=c6*+c7*/disk=large/extras=s3-cache
    env:
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    strategy:
      fail-fast: false
      matrix:
        include:
          - crypto: bls12-381
            cargo_flags: --features=integration-test,fault-injection,scale-testing
          - crypto: decaf377
            cargo_flags: --no-default-features --features=decaf377,redb,integration-test,fault-injection,scale-testing
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Update Rust stable
      run: rustup update stable
    - name: Cache cargo + target
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.crypto }}
    - name: Install protoc + lld
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler lld
    - name: Install cargo-nextest
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest
    - uses: docker/setup-buildx-action@v3
    - name: Build orbis-node integration image (${{ matrix.crypto }})
      # cargo-chef in docker/Dockerfile makes the dependency compile a cached
      # layer, so a source-only change rebuilds just the workspace crates. Built
      # once here (not once per test) — the harness reuses it via
      # ORBIS_INTEGRATION_IMAGE instead of `docker compose up --build`.
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        load: true
        tags: orbis-node-integration:${{ matrix.crypto }}
        build-args: |
          ENABLE_INTEGRATION_TEST=true
          CRYPTO_FEATURE=${{ matrix.crypto }}
        cache-from: type=gha,scope=integ-${{ matrix.crypto }}
        cache-to: type=gha,scope=integ-${{ matrix.crypto }},mode=max
    - name: Run tests (${{ matrix.crypto }})
      # No doctests in this workspace (all fences are ```ignore), so nextest
      # covers everything `cargo test` did.
      env:
        ORBIS_INTEGRATION_CRYPTO: ${{ matrix.crypto }}
        ORBIS_INTEGRATION_IMAGE: orbis-node-integration:${{ matrix.crypto }}
      run: cargo nextest run --profile ci ${{ matrix.cargo_flags }}
