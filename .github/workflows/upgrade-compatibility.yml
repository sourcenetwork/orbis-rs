name: Upgrade Compatibility

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      from_ref:
        description: Baseline git ref containing the upgrade-driver v1 contract
        required: true
        type: string
      to_ref:
        description: Target ref (defaults to the dispatched commit)
        required: false
        type: string
      crypto:
        description: Crypto implementation matrix
        required: true
        default: both
        type: choice
        options:
          - both
          - bls12-381
          - jubjub

permissions:
  contents: read

concurrency:
  group: upgrade-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: ${{ matrix.crypto }} upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        crypto: ${{ fromJSON(github.event_name == 'pull_request' && '["bls12-381","jubjub"]' || inputs.crypto == 'both' && '["bls12-381","jubjub"]' || format('["{0}"]', inputs.crypto)) }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.to_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve baseline revision
        id: baseline
        env:
          FROM_REF: ${{ inputs.from_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${PR_BASE_SHA}" ]]; then
            sha=$(git rev-parse --verify "${PR_BASE_SHA}^{commit}")
          elif sha=$(git rev-parse --verify "${FROM_REF}^{commit}" 2>/dev/null); then
            :
          elif sha=$(git rev-parse --verify "origin/${FROM_REF}^{commit}" 2>/dev/null); then
            :
          else
            echo "Unable to resolve baseline ref: ${FROM_REF}" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Check baseline curve support
        id: curve
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          CRYPTO: ${{ matrix.crypto }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if git show "$BASELINE_SHA:crates/crypto/Cargo.toml" | grep -Eq "^${CRYPTO}[[:space:]]*="; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == pull_request && "$CRYPTO" == jubjub ]]; then
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "Jubjub upgrade: not applicable / not tested. Baseline $BASELINE_SHA predates Jubjub; existing rings require fresh DKG to change curves." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Baseline $BASELINE_SHA does not support $CRYPTO. Select a baseline with the requested curve."
            exit 1
          fi

      - name: Run cross-commit upgrade gate
        if: steps.curve.outputs.supported == 'true'
        env:
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
        shell: bash
        # The harness auto-selects --fresh-target-chain when HEAD's
        # docker/VERA_REF differs from the selected baseline's (the baseline
        # chain otherwise cannot verify the target's threshold signatures).
        run: |
          scripts/test-upgrade-unit.sh
          scripts/test-upgrade.sh \
            --from "$BASELINE_SHA" \
            --to HEAD \
            --crypto "${{ matrix.crypto }}" \
            --output "upgrade-results/${{ matrix.crypto }}"
