[workspace]
resolver = "2"
members = [
    "crates/network", 
    "bin/orbis-node", 
    "crates/crypto", 
    "crates/local-storage", 
    "bin/cli-tool", "crates/authn",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Orbis Contributors"]
license = "MIT OR Apache-2.0"
rust-version = "1.70"

[workspace.dependencies]
# Common dependencies across workspace
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
hex = "0.4"
futures = "0.3"

# Networking
iroh = "0.95"
iroh-gossip = "0.95"

# Enable alloc feature for form_urlencoded to fix compatibility with did-key
form_urlencoded = { version = "1.2", features = ["alloc"] }

