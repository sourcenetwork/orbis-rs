[workspace]
resolver = "2"
members = [
    "crates/network",
    "crates/proto",
    "bin/orbis-node",
    "crates/crypto",
    "crates/local-storage",
    "bin/cli-tool",
    "crates/authn", 
    "crates/authz", 
    "crates/common",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Orbis Contributors"]
license = "MIT OR Apache-2.0"
rust-version = "1.70"

[workspace.dependencies]
# Common dependencies across workspace
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
hex = "0.4"
futures = "0.3"
sha2 = "0.10"

# Networking
iroh = "0.95"
iroh-gossip = "0.95"

# Enable alloc feature for form_urlencoded to fix compatibility with did-key
form_urlencoded = { version = "1.2", features = ["alloc"] }

# Blockchain / Cosmos SDK
cosmrs = { version = "0.19", features = ["rpc", "bip32"] }
tendermint = "0.39"
tendermint-rpc = { version = "0.39", features = ["http-client"] }
reqwest = { version = "0.12", features = ["json"] }
bip32 = { version = "0.5", features = ["mnemonic", "bip39"] }
k256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.13"
tonic = "0.12"
rand = "0.8"
base64 = "0.22"
did-key = "0.2.1"
project-root = "0.2.2"
