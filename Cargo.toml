[workspace]
resolver = "2"
members = [
    "crates/network",
    "crates/proto",
    "bin/orbis-node",
    "crates/crypto",
    "crates/local-storage",
    "bin/cli-tool",
    "bin/orbis-bench",
    "crates/authn",
    "crates/authz",
    "crates/common",
    "crates/bulletin",
    "crates/test-support",
]

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Orbis Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Common dependencies across workspace
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
hex = "0.4"
futures = "0.3"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }

# Networking
iroh = "0.95"
iroh-gossip = "0.95"
bytes = "1.5"

# Enable alloc feature for form_urlencoded to fix compatibility with did-key
form_urlencoded = { version = "1.2", features = ["alloc"] }

# Blockchain / Cosmos SDK
cosmrs = { version = "0.22", features = ["rpc", "bip32"] }
tendermint = "0.40"
tendermint-rpc = { version = "0.40", features = ["http-client"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
bip32 = { version = "0.5", features = ["mnemonic", "bip39"] }
k256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.14.1"
tonic = "0.14.2"
tonic-prost = "0.14"
tonic-build = "0.14.2"
tonic-prost-build = "0.14"
rand = "0.8"
base64 = "0.22"
did-key = "0.2.1"
project-root = "0.2.2"
bincode = "1.3"

# Metrics
prometheus = { version = "0.13", default-features = false, features = ["process"] }
lazy_static = "1.4"
hyper = { version = "1.4", features = ["server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tempfile = "3"
