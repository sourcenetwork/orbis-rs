[workspace]
resolver = "2"
members = [
    "crates/network",
    "crates/proto",
    "bin/orbis-node",
    "crates/crypto",
    "crates/local-storage",
    "bin/cli-tool",
    "crates/authn", 
    "crates/authz", 
    "crates/common", 
    "crates/bulletin",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
authors = ["Orbis Contributors"]
license = "MIT OR Apache-2.0"
rust-version = "1.70"

[workspace.dependencies]
# Common dependencies across workspace
tokio = { version = "1.0", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
hex = "0.4"
futures = "0.3"
sha2 = "0.10"

# Networking
iroh = "0.95"
iroh-gossip = "0.95"

# Enable alloc feature for form_urlencoded to fix compatibility with did-key
form_urlencoded = { version = "1.2", features = ["alloc"] }

# Blockchain / Cosmos SDK
cosmrs = { version = "0.19", features = ["rpc", "bip32"] }
tendermint = "0.40"
tendermint-rpc = { version = "0.40", features = ["http-client", "websocket-client"] }
reqwest = { version = "0.12", features = ["json"] }
bip32 = { version = "0.5", features = ["mnemonic", "bip39"] }
k256 = { version = "0.13", features = ["ecdsa"] }
alloy-primitives = "1.0"
alloy-consensus = { version = "1.0", features = ["k256"] }
alloy-eips = "1.0"
alloy-signer = "1"
alloy-signer-local = { version = "1", default-features = false }
alloy-sol-types = "1"
prost = "0.13"
tonic = "0.12"
rand = "0.8"
base64 = "0.22"
did-key = "0.2.1"
project-root = "0.2.2"
acp-light-client = { git = "https://github.com/sourcenetwork/backbone.git", branch = "main" }

# Metrics
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"
hyper = { version = "1.4", features = ["server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }