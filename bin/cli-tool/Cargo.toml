[package]
name = "cli-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.4.18", features = ["derive", "env"] }
tokio = { workspace = true }
tonic = { workspace = true }
proto = { path = "../../crates/proto" }
anyhow = { workspace = true }
futures = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
crypto = { path = "../../crates/crypto", default-features = false }
authn = { path = "../../crates/authn" }
authz = { path = "../../crates/authz" }
common = { path = "../../crates/common" }
bulletin = { path = "../../crates/bulletin", default-features = false, features = ["sourcehub"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
did-key = { workspace = true }
sha2 = { workspace = true }

[features]
default = ["bls12-381"]
bls12-381 = ["crypto/bls12-381", "bulletin/bls12-381", "common/bls12-381"]
decaf377 = ["crypto/decaf377", "bulletin/decaf377", "common/decaf377"]


[lints]
workspace = true
