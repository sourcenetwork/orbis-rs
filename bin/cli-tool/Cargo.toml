[package]
name = "cli-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.4.18", features = ["derive", "env"] }
tokio = { workspace = true }
tonic = { workspace = true }
proto = { path = "../../crates/proto" }
anyhow = { workspace = true }
futures = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
crypto = { path = "../../crates/crypto", default-features = false }
authn = { path = "../../crates/authn" }
orbis-webauthn.workspace = true
orbis-email.workspace = true
orbis-sdk = { workspace = true, features = ["webauthn", "email"] }
p256 = { version = "0.13", features = ["ecdsa"] }
authz = { path = "../../crates/authz" }
common = { path = "../../crates/common", features = ["funding"] }
bulletin = { path = "../../crates/bulletin", default-features = false, features = ["vera-go"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
rpassword = "7.3"
bs58 = "0.5"

vera-client = { workspace = true, optional = true }
alloy-primitives = { version = "1", optional = true }
vera-domain = { workspace = true, optional = true }
local-storage = { path = "../../crates/local-storage", default-features = false, features = ["redb"], optional = true }
zeroize = { workspace = true, optional = true }

[[bin]]
name = "vera-admin"
path = "src/bin/vera-admin.rs"
required-features = ["vera"]

[features]
vera = ["bulletin/vera", "common/vera", "dep:alloy-primitives", "dep:vera-client", "dep:vera-domain", "dep:local-storage", "dep:zeroize"]
default = ["bls12-381"]
bls12-381 = ["crypto/bls12-381", "orbis-sdk/bls12-381"]
jubjub = ["crypto/jubjub", "orbis-sdk/jubjub"]

[[test]]
name = "vera_admin"
required-features = ["vera"]

[dev-dependencies]
vera-harness = { workspace = true }
vera-crypto = { workspace = true }
commonware-codec = "=2026.10.0"
k256.workspace = true
tempfile.workspace = true


[lints]
workspace = true
