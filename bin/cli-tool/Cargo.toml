[package]
name = "cli-tool"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.4.18", features = ["derive", "env"] }
tokio = { workspace = true }
tonic = { workspace = true }
proto = { path = "../../crates/proto" }
anyhow = { workspace = true }
futures = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
crypto = { path = "../../crates/crypto", default-features = false }
authn = { path = "../../crates/authn" }
authz = { path = "../../crates/authz" }
common = { path = "../../crates/common" }
bulletin = { path = "../../crates/bulletin", default-features = false, features = ["vera"] }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
did-key = { workspace = true }
sha2 = { workspace = true }
rpassword = "7.3"
bs58 = "0.5"

hub-client = { git = "https://github.com/sourcenetwork/hub.rs", rev = "bee6c6f5950b163313b8704fd10e3f136bce6b68", optional = true }
alloy-primitives = { version = "1", optional = true }
hub-domain = { git = "https://github.com/sourcenetwork/hub.rs", rev = "bee6c6f5950b163313b8704fd10e3f136bce6b68", optional = true }
local-storage = { path = "../../crates/local-storage", default-features = false, features = ["redb"], optional = true }
zeroize = { workspace = true, optional = true }

[[bin]]
name = "vera-admin"
path = "src/bin/vera-admin.rs"
required-features = ["native"]

[features]
native = ["bulletin/native", "dep:alloy-primitives", "dep:hub-client", "dep:hub-domain", "dep:local-storage", "dep:zeroize"]
default = ["bls12-381"]
bls12-381 = ["crypto/bls12-381", "bulletin/bls12-381", "common/bls12-381"]
decaf377 = ["crypto/decaf377", "bulletin/decaf377", "common/decaf377"]

[[test]]
name = "native_admin"
required-features = ["native"]

[dev-dependencies]
hub-harness = { git = "https://github.com/sourcenetwork/hub.rs", rev = "bee6c6f5950b163313b8704fd10e3f136bce6b68" }
hub-crypto = { git = "https://github.com/sourcenetwork/hub.rs", rev = "bee6c6f5950b163313b8704fd10e3f136bce6b68" }
commonware-codec = "2026.9.0"
k256.workspace = true
tempfile.workspace = true


[lints]
workspace = true
