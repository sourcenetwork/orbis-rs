[package]
name = "orbis-dev-cluster"
description = "Spins up and seeds a local, Docker-backed native Vera cluster for trying the example-integrations apps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
readme = "README.md"

[dependencies]
test-support = { path = "../../../crates/test-support", default-features = false, features = [
    "vera",
] }
cli-tool = { path = "../../cli-tool", default-features = false }
vera-client = { workspace = true }
vera-domain = { workspace = true }
vera-harness = { workspace = true }
vera-crypto = { workspace = true }
proto = { path = "../../../crates/proto" }
k256 = { version = "0.14", features = ["ecdsa"] }
alloy-primitives = "1"
tokio = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[features]
default = ["bls12-381"]
# Forwards to `cli-tool`'s matching curve backend — hardcoding one here
# unconditionally (instead of forwarding) would force that backend on for
# any whole-workspace build, breaking the other backend's build via
# `crypto`'s own "mutually exclusive" guard.
bls12-381 = ["cli-tool/bls12-381"]
jubjub = ["cli-tool/jubjub"]

[lints]
workspace = true
