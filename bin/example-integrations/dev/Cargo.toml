[package]
name = "orbis-dev-cluster"
description = "Spins up and seeds a local, Docker-backed native Vera cluster for trying the example-integrations apps"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
readme = "README.md"

[dependencies]
test-support = { path = "../../../crates/test-support", default-features = false, features = [
    "vera",
] }
cli-tool = { path = "../../cli-tool", default-features = false, features = [
    "bls12-381",
] }
vera-client = { workspace = true }
vera-domain = { workspace = true }
vera-harness = { workspace = true }
vera-crypto = { workspace = true }
proto = { path = "../../../crates/proto" }
k256 = { version = "0.14", features = ["ecdsa"] }
alloy-primitives = "1"
tokio = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
