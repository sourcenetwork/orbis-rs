[package]
name = "orbis-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
authn = { path = "../../crates/authn" }
bulletin = { path = "../../crates/bulletin", default-features = false, features = ["dummy-type"] }
clap = { version = "4.5", features = ["derive"] }
cli-tool = { path = "../cli-tool", default-features = false }
crypto = { path = "../../crates/crypto", default-features = false }
futures = { workspace = true }
hex = { workspace = true }
network = { path = "../../crates/network", features = ["shaping"] }
orbis-node = { path = "../orbis-node", default-features = false, optional = true }
proto = { path = "../../crates/proto" }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = "0.1.16"
tracing-subscriber = { version = "0.3", features = ["tracing-log", "fmt", "env-filter"] }
uuid = { version = "1", features = ["v4"] }

[features]
default = ["bls12-381", "orbis-node"]
# In-process benchmark node. The curve features do not enable this; build
# Jubjub with `--features jubjub,orbis-node`.
orbis-node = [
    "dep:orbis-node",
    "orbis-node/redb",
    "orbis-node/authz-vera",
    "orbis-node/bulletin-vera",
    "orbis-node/iroh",
    "orbis-node/harness",
]
bls12-381 = ["cli-tool/bls12-381", "crypto/bls12-381"]
jubjub = ["cli-tool/jubjub", "crypto/jubjub"]

[[bin]]
name = "orbis-bench"
path = "src/main.rs"
required-features = ["orbis-node"]

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
