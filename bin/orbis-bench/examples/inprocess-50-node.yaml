schema_version: 1
name: orbis-inprocess-50-node
crypto: bls12-381

# In-process backend: real orbis-node instances run as tokio tasks in this
# process over real loopback Iroh P2P, backed by a shared in-memory mock
# bulletin instead of a Dockerized SourceHub. No containers, no chain, no
# external network dependency — this isolates orbis's own DKG/PRE/SIGN
# protocol and P2P networking behavior from infrastructure flakiness
# (SourceHub RPC hiccups, Iroh relay reachability, Docker host contention
# under 50+ containers) that has nothing to do with protocol correctness.
#
# v1 scope: dkg, pre, and sign, on a `lan`-kind profile only (see
# `Experiment::validate` in config.rs) — there is no PSS refresh/reshare
# support and no network shaping on this backend yet.
backend: in-process

networks:
  - network_size: 50
    cases:
      - { ring_size: 50, threshold: 34 }

operations: [dkg, pre, sign]
profiles:
  - name: lan
    kind: lan

warmups: 1
repetitions: 5
seed: 185974508
output_dir: bench-results

load:
  concurrency: [1, 4, 16]
  warmup_secs: 10
  measure_secs: 30

timeouts:
  setup_secs: 300
  dkg_secs: 300
  pre_secs: 120
  sign_secs: 120
