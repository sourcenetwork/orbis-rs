[package]
name = "orbis-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
orbis-reporting = { path = "../../crates/reporting" }
network = { path = "../../crates/network" }
crypto = { path = "../../crates/crypto", default-features = false }
local-storage = { path = "../../crates/local-storage", default-features = false }
proto = { path = "../../crates/proto" }
authn = { path = "../../crates/authn" }
authz = { path = "../../crates/authz", default-features = false }
bulletin = { path = "../../crates/bulletin", default-features = false }
tonic = { workspace = true }
tonic-web = "0.14.2"
tower-http = { version = "0.6", features = ["cors"] }
iroh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
rand = "0.9.2"
getrandom = "0.2"
base64 = "0.22.1"
dirs = "5.0"
rpassword = "7.3"
tracing-subscriber = { version = "0.3", features = ["tracing-log", "fmt", "env-filter"] }
tracing = { version = "0.1.16"}
tracing-loki = "0.2"
url = "2.5"
sha2 = { workspace = true }
zeroize = { workspace = true }
common = { path = "../../crates/common", default-features = false }
project-root = { workspace = true }
cli-tool = { path = "../cli-tool", optional = true, default-features = false }
prometheus = { workspace = true }
lazy_static = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true }                                                                                                                                                                                                                                                                                                                                                                                

vera-client = { git = "https://github.com/sourcenetwork/vera.rs", rev = "d50ab9e5f94b81cccd1c70c36190dea7e7cd74c2", optional = true }
vera-domain = { git = "https://github.com/sourcenetwork/vera.rs", rev = "d50ab9e5f94b81cccd1c70c36190dea7e7cd74c2", optional = true }
commonware-codec = { version = "2026.9.0", optional = true }
k256 = { workspace = true, optional = true }

[dev-dependencies]
acp-light-client = { git = "https://github.com/sourcenetwork/backbone.git", rev = "e5e13a10f88d6736a47a83e8593755442dd6cf2c" }
defra-node = { git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc", default-features = false, features = ["p2p"] }
defra-p2p = { package = "p2p", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc", default-features = false, features = ["iroh-transport"] }
defra-blockstore = { package = "blockstore", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc" }
defra-db = { package = "db", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc", default-features = false, features = ["native"] }
defra-storage = { package = "storage", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc" }
defra-query = { package = "query", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc" }
defra-schema = { package = "schema", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc" }
defra-document = { package = "document", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc" }
did-key.workspace = true
defra-orbis = { package = "orbis", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc" }
defra-identity = { package = "identity", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc" }
defra-crypto = { package = "crypto", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc" }
defra-core = { package = "defra-core", git = "https://github.com/sourcenetwork/defradb.rs", rev = "8d144f339862a4ad30d93aed53a2cc9123ee71bc" }
alloy-primitives = "1"
vera-crypto = { git = "https://github.com/sourcenetwork/vera.rs", rev = "d50ab9e5f94b81cccd1c70c36190dea7e7cd74c2" }
vera-harness = { git = "https://github.com/sourcenetwork/vera.rs", rev = "d50ab9e5f94b81cccd1c70c36190dea7e7cd74c2" }
vera-acp = { package = "acp", git = "https://github.com/sourcenetwork/vera.rs", rev = "d50ab9e5f94b81cccd1c70c36190dea7e7cd74c2" }
vera-modules = { git = "https://github.com/sourcenetwork/vera.rs", rev = "d50ab9e5f94b81cccd1c70c36190dea7e7cd74c2" }
alloy-sol-types = "1"
authz = { path = "../../crates/authz", features = ["test-helpers"] }
bulletin = { path = "../../crates/bulletin", features = ["dummy-type"] }
bs58 = "0.5"
serial_test = "3.2.0"
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
rand_core = "0.6"
crypto = { path = "../../crates/crypto", default-features = false, features = ["test-helpers"] }
tokio-stream = "0.1"
tonic-prost = { workspace = true }
cli-tool = { path = "../cli-tool", default-features = false }
tempfile = { workspace = true }
# Docker Compose integration-test harness (Vera + orbis-node containers).
test-support = { path = "../../crates/test-support" }

[[test]]
name = "native_startup"
required-features = ["native"]

[features]
native = ["authz/native", "bulletin/native", "local-storage/redb", "dep:vera-client", "dep:vera-domain", "dep:commonware-codec", "dep:k256"]
default = ["local-storage/redb", "bls12-381", "authz-vera", "bulletin-vera", "network/iroh"]
bls12-381 = ["crypto/bls12-381", "cli-tool?/bls12-381", "common/bls12-381", "bulletin/bls12-381"]
jubjub = ["crypto/jubjub", "cli-tool?/jubjub", "common/jubjub", "bulletin/jubjub"]
redb = ["local-storage/redb"]
memory = ["local-storage/memory"]
cosmos = ["common/cosmos"]
authz-vera = ["authz/vera", "cosmos"]
bulletin-vera = ["bulletin/vera", "cosmos"]
iroh = ["network/iroh"]
integration-test = ["cli-tool", "unsafe-testing", "authz-vera", "bulletin-vera"]
unsafe-testing = []
# In-process, no-Docker, no-chain test/benchmark harness: real orbis-node
# instances as tokio tasks, backed by a caller-injected mock bulletin instead
# of Vera. Not used by the production binary.
harness = ["authz/test-helpers", "network/shaping", "bulletin/dummy-type", "cosmos"]
fault-injection = ["network/fault-injection"]
# Native in-process scale test (tests::scale_testing): many real orbis-node
# instances running a full DKG ceremony in one process. Implies `harness`.
scale-testing = ["harness"]
[lints]
workspace = true
