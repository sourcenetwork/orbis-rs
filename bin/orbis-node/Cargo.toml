[package]
name = "orbis-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
network = { path = "../../crates/network" }
crypto = { path = "../../crates/crypto" }
local-storage = { path = "../../crates/local-storage", default-features = false }
proto = { path = "../../crates/proto" }
authn = { path = "../../crates/authn" }
authz = { path = "../../crates/authz" }
bulletin = { path = "../../crates/bulletin" }
tonic = "0.14.2"
iroh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
thiserror = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ark-serialize = "0.4"
ark-bls12-381 = "0.4"
rand = "0.9.2"
getrandom = "0.2"
base64 = "0.22.1"
dirs = "5.0"
rpassword = "7.3"
tracing-subscriber = { version = "0.3", features = ["tracing-log", "fmt", "env-filter"] }
tracing = { version = "0.1.16"}
tracing-loki = "0.2"
url = "2.5"
sha2 = { workspace = true }
common = { path = "../../crates/common" }
project-root = { workspace = true }
cli-tool = { path = "../cli-tool", optional = true }
prometheus = { workspace = true }
lazy_static = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true }                                                                                                                                                                                                                                                                                                                                                                                

[dev-dependencies]
serial_test = "3.2.0"
ark-ec = "0.4"
ark-std = "0.4"
rand_core = "0.6"
crypto = { path = "../../crates/crypto", features = ["test-helpers"] }
tokio-stream = "0.1"
cli-tool = { path = "../cli-tool" }

[features]
default = ["local-storage/redb"]
redb = ["local-storage/redb"]
memory = ["local-storage/memory"]
integration-test = ["cli-tool"]