[package]
name = "orbis-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
network = { path = "../../crates/network" }
crypto = { path = "../../crates/crypto", default-features = false }
local-storage = { path = "../../crates/local-storage", default-features = false }
proto = { path = "../../crates/proto" }
authn = { path = "../../crates/authn" }
authz = { path = "../../crates/authz" }
bulletin = { path = "../../crates/bulletin" }
tonic = "0.14.2"
iroh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
thiserror = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.9.2"
getrandom = "0.2"
base64 = "0.22.1"
dirs = "5.0"
rpassword = "7.3"
tracing-subscriber = { version = "0.3", features = ["tracing-log", "fmt", "env-filter"] }
tracing = { version = "0.1.16"}
tracing-loki = "0.2"
url = "2.5"
sha2 = { workspace = true }
common = { path = "../../crates/common" }
project-root = { workspace = true }
cli-tool = { path = "../cli-tool", optional = true, default-features = false }
prometheus = { workspace = true }
lazy_static = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true }                                                                                                                                                                                                                                                                                                                                                                                

[dev-dependencies]
authz = { path = "../../crates/authz", features = ["test-helpers"] }
serial_test = "3.2.0"
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
rand_core = "0.6"
crypto = { path = "../../crates/crypto", default-features = false, features = ["test-helpers"] }
tokio-stream = "0.1"
cli-tool = { path = "../cli-tool", default-features = false }

[features]
default = ["local-storage/redb", "bls12-381", "authz-sourcehub", "bulletin-sourcehub", "network/iroh"]
bls12-381 = ["crypto/bls12-381", "cli-tool?/bls12-381", "common/bls12-381"]
decaf377 = ["crypto/decaf377", "cli-tool?/decaf377", "common/decaf377"]
redb = ["local-storage/redb"]
memory = ["local-storage/memory"]
authz-sourcehub = ["authz/sourcehub"]
bulletin-sourcehub = ["bulletin/sourcehub"]
iroh = ["network/iroh"]
integration-test = ["cli-tool"]