[package]
name = "orbis-node"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
orbis-reporting = { path = "../../crates/reporting" }
network = { path = "../../crates/network" }
crypto = { path = "../../crates/crypto", default-features = false }
local-storage = { path = "../../crates/local-storage", default-features = false }
proto = { path = "../../crates/proto" }
authn = { path = "../../crates/authn" }
authz = { path = "../../crates/authz" }
bulletin = { path = "../../crates/bulletin" }
tonic = { workspace = true }
tonic-web = "0.14.2"
tower-http = { version = "0.6", features = ["cors"] }
iroh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
rand = "0.9.2"
getrandom = "0.2"
base64 = "0.22.1"
dirs = "5.0"
rpassword = "7.3"
tracing-subscriber = { version = "0.3", features = ["tracing-log", "fmt", "env-filter"] }
tracing = { version = "0.1.16"}
tracing-loki = "0.2"
url = "2.5"
sha2 = { workspace = true }
zeroize = { workspace = true }
common = { path = "../../crates/common" }
project-root = { workspace = true }
cli-tool = { path = "../cli-tool", optional = true, default-features = false }
prometheus = { workspace = true }
lazy_static = { workspace = true }
hyper = { workspace = true }
http-body-util = { workspace = true }
hyper-util = { workspace = true }                                                                                                                                                                                                                                                                                                                                                                                

hub-client = { git = "https://github.com/sourcenetwork/hub.rs", rev = "e69b90d843b47f857c86d18fec558eb653aadf83", optional = true }
hub-domain = { git = "https://github.com/sourcenetwork/hub.rs", rev = "e69b90d843b47f857c86d18fec558eb653aadf83", optional = true }
commonware-codec = { version = "2026.9.0", optional = true }
k256 = { workspace = true, optional = true }

[dev-dependencies]
acp-light-client = { git = "https://github.com/sourcenetwork/backbone.git", rev = "9aa568b872861317e52d5ec82ded10c18cd66277" }
defra-node = { git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9", default-features = false, features = ["p2p"] }
defra-p2p = { package = "p2p", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9", default-features = false, features = ["iroh-transport"] }
defra-blockstore = { package = "blockstore", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9" }
defra-db = { package = "db", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9", default-features = false, features = ["native"] }
defra-storage = { package = "storage", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9" }
defra-query = { package = "query", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9" }
defra-schema = { package = "schema", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9" }
defra-document = { package = "document", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9" }
did-key.workspace = true
defra-orbis = { package = "orbis", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9" }
defra-identity = { package = "identity", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9" }
defra-crypto = { package = "crypto", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9" }
defra-core = { package = "defra-core", git = "https://github.com/sourcenetwork/defradb.rs", rev = "e24f35cf54139572be7e0c25db3691355e7d93c9" }
alloy-primitives = "1"
hub-crypto = { git = "https://github.com/sourcenetwork/hub.rs", rev = "e69b90d843b47f857c86d18fec558eb653aadf83" }
hub-harness = { git = "https://github.com/sourcenetwork/hub.rs", rev = "e69b90d843b47f857c86d18fec558eb653aadf83" }
authz = { path = "../../crates/authz", features = ["test-helpers"] }
bs58 = "0.5"
serial_test = "3.2.0"
ark-bls12-381 = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
rand_core = "0.6"
crypto = { path = "../../crates/crypto", default-features = false, features = ["test-helpers"] }
tokio-stream = "0.1"
tonic-prost = { workspace = true }
cli-tool = { path = "../cli-tool", default-features = false }
tempfile = { workspace = true }
# Docker Compose integration-test harness (Vera + orbis-node containers).
test-support = { path = "../../crates/test-support" }

[[test]]
name = "native_startup"
required-features = ["native"]

[features]
native = ["authz/native", "bulletin/native", "local-storage/redb", "dep:hub-client", "dep:hub-domain", "dep:commonware-codec", "dep:k256"]
default = ["local-storage/redb", "bls12-381", "authz-vera", "bulletin-vera", "network/iroh"]
bls12-381 = ["crypto/bls12-381", "cli-tool?/bls12-381", "common/bls12-381", "bulletin/bls12-381"]
decaf377 = ["crypto/decaf377", "cli-tool?/decaf377", "common/decaf377", "bulletin/decaf377"]
redb = ["local-storage/redb"]
memory = ["local-storage/memory"]
authz-vera = ["authz/vera"]
bulletin-vera = ["bulletin/vera"]
iroh = ["network/iroh"]
integration-test = ["cli-tool", "unsafe-testing"]
unsafe-testing = []
# In-process, no-Docker, no-chain test/benchmark harness: real orbis-node
# instances as tokio tasks, backed by a caller-injected mock bulletin instead
# of Vera. Not used by the production binary.
harness = ["authz/test-helpers", "network/shaping"]
fault-injection = ["network/fault-injection"]
# Native in-process scale test (tests::scale_testing): many real orbis-node
# instances running a full DKG ceremony in one process. Implies `harness`.
scale-testing = ["harness"]
[lints]
workspace = true
