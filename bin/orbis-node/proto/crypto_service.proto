syntax = "proto3";

package crypto_service;

service CryptoService {
  rpc StartDkg(StartDkgRequest) returns (StartDkgResponse);
}

message StartDkgRequest {
  string session_id = 1;
  uint32 threshold = 2;
  uint32 total_participants = 3;
  repeated string participant_ids = 4;
  repeated string peer_ids = 5;  // Iroh peer IDs that this node needs to connect to
  map<string, string> parameters = 6;
}

message StartDkgResponse {
  string session_id = 1;
  string status = 2;
  string message = 3;
  int64 created_at = 4;
}