[package]
name = "authz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
common = { path = "../common", default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

vera-identity = { workspace = true, optional = true }
vera-client = { workspace = true, optional = true }
vera-domain = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
url = { version = "2.5", optional = true }
alloy-primitives = { version = "1", optional = true }
commonware-codec = { version = "2026.9.0", optional = true }

[features]
default = ["vera"]
vera = ["common/cosmos"]
native = ["dep:vera-identity", "dep:vera-client", "dep:vera-domain", "dep:hex", "dep:url", "dep:alloy-primitives", "dep:commonware-codec"]
test-helpers = []
# The `AuthzFactory`/`PreparedAuthz` traits and factory impls. Separate from
# `native`/`vera` (which just compile the backend module for direct use —
# `cli-tool`'s admin tooling needs those without ever touching a factory) so
# a build that never constructs a factory doesn't need the shared startup API.
startup = ["common/startup"]
# Select the corresponding `AuthzFactoryImpl`. Implies `startup` since
# selecting one *is* constructing a factory.
select-native = ["native", "startup"]
select-vera = ["vera", "startup"]

[[test]]
name = "native_service"
required-features = ["native"]

[dev-dependencies]
vera-harness = { workspace = true }
alloy-primitives = "1"
tokio = { workspace = true, features = ["full", "process"] }
serial_test = "3.2.0"
did-key = { workspace = true }
# Vera-backend tests use the Docker integration harness (VeraTestContainer).
test-support = { path = "../test-support" }

[lints]
workspace = true
