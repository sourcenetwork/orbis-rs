[package]
name = "authz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
common = { path = "../common" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

vera-client = { git = "https://github.com/sourcenetwork/hub.rs", rev = "cf5ae4751867b4b8f07f7b31bfc2ca68ff052ca4", optional = true }
vera-domain = { git = "https://github.com/sourcenetwork/hub.rs", rev = "cf5ae4751867b4b8f07f7b31bfc2ca68ff052ca4", optional = true }
hex = { workspace = true, optional = true }

[features]
default = ["vera"]
vera = []
native = ["dep:vera-client", "dep:vera-domain", "dep:hex"]
test-helpers = []

[[test]]
name = "native_service"
required-features = ["native"]

[dev-dependencies]
vera-harness = { git = "https://github.com/sourcenetwork/hub.rs", rev = "cf5ae4751867b4b8f07f7b31bfc2ca68ff052ca4" }
alloy-primitives = "1"
tokio = { workspace = true, features = ["full", "process"] }
serial_test = "3.2.0"
did-key = { workspace = true }
# Vera-backend tests use the Docker integration harness (VeraTestContainer).
test-support = { path = "../test-support" }

[lints]
workspace = true
