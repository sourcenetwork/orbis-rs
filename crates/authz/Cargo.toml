[package]
name = "authz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
common = { path = "../common", default-features = false }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

vera-identity = { git = "https://github.com/sourcenetwork/vera.rs", rev = "982a617e7626a855bc9edce63d85385f74824129", optional = true }
vera-client = { git = "https://github.com/sourcenetwork/vera.rs", rev = "982a617e7626a855bc9edce63d85385f74824129", optional = true }
vera-domain = { git = "https://github.com/sourcenetwork/vera.rs", rev = "982a617e7626a855bc9edce63d85385f74824129", optional = true }
hex = { workspace = true, optional = true }

[features]
default = ["vera"]
vera = ["common/cosmos"]
native = ["dep:vera-identity", "dep:vera-client", "dep:vera-domain", "dep:hex"]
test-helpers = []

[[test]]
name = "native_service"
required-features = ["native"]

[dev-dependencies]
vera-harness = { git = "https://github.com/sourcenetwork/vera.rs", rev = "982a617e7626a855bc9edce63d85385f74824129" }
alloy-primitives = "1"
tokio = { workspace = true, features = ["full", "process"] }
serial_test = "3.2.0"
did-key = { workspace = true }
# Vera-backend tests use the Docker integration harness (VeraTestContainer).
test-support = { path = "../test-support" }

[lints]
workspace = true
