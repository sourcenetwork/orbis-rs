[package]
name = "authz"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
common = { path = "../common" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

hub-client = { git = "https://github.com/sourcenetwork/hub.rs", rev = "8f1db8a4202dc64639752e2be37ef0294bd79b28", optional = true }
hub-domain = { git = "https://github.com/sourcenetwork/hub.rs", rev = "8f1db8a4202dc64639752e2be37ef0294bd79b28", optional = true }
hex = { workspace = true, optional = true }

[features]
default = ["vera"]
vera = []
native = ["dep:hub-client", "dep:hub-domain", "dep:hex"]
test-helpers = []

[[test]]
name = "native_service"
required-features = ["native"]

[dev-dependencies]
hub-harness = { git = "https://github.com/sourcenetwork/hub.rs", rev = "8f1db8a4202dc64639752e2be37ef0294bd79b28" }
alloy-primitives = "1"
tokio = { workspace = true, features = ["full", "process"] }
serial_test = "3.2.0"
did-key = { workspace = true }
# Vera-backend tests use the Docker integration harness (VeraTestContainer).
test-support = { path = "../test-support" }

[lints]
workspace = true
