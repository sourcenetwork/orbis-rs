[package]
name = "bulletin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
orbis-reporting = { path = "../reporting" }
async-trait = { workspace = true }
thiserror ={ workspace = true }
common = { path = "../common" }
crypto = { path = "../crypto", optional = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
backoff = { version = "0.4", features = ["tokio"] }
tokio = { workspace = true }

commonware-codec = { version = "2026.9.0", optional = true }
url = { version = "2.5", optional = true }
vera-client = { git = "https://github.com/sourcenetwork/hub.rs", rev = "b0021e7892eeda7ad6f76744a2a39c05b242307d", optional = true }
vera-domain = { git = "https://github.com/sourcenetwork/hub.rs", rev = "b0021e7892eeda7ad6f76744a2a39c05b242307d", optional = true }
alloy-primitives = { version = "1", optional = true }
k256 = { workspace = true, optional = true }
local-storage = { path = "../local-storage", optional = true }
zeroize = { workspace = true, optional = true }

[features]
default = ["vera"]
vera = []
native = ["dep:commonware-codec", "dep:url", "dep:vera-client", "dep:vera-domain", "dep:alloy-primitives", "dep:k256", "dep:local-storage", "dep:zeroize"]
dummy = []
bls12-381 = ["dep:crypto", "crypto/bls12-381"]
decaf377 = ["dep:crypto", "crypto/decaf377"]

[[test]]
name = "native_service"
required-features = ["native"]

[dev-dependencies]
vera-harness = { git = "https://github.com/sourcenetwork/hub.rs", rev = "b0021e7892eeda7ad6f76744a2a39c05b242307d" }
vera-crypto = { git = "https://github.com/sourcenetwork/hub.rs", rev = "b0021e7892eeda7ad6f76744a2a39c05b242307d" }
blst = "0.3"
commonware-math = "2026.9.0"
tempfile.workspace = true
serial_test = "3.2.0"
tokio = { workspace = true, features = ["full", "process"] }
# Vera-backend tests use the Docker integration harness (VeraTestContainer).
test-support = { path = "../test-support" }
[lints]
workspace = true
