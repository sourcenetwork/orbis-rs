[package]
name = "bulletin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror ={ workspace = true }
common = { path = "../common" }
crypto = { path = "../crypto", optional = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
backoff = { version = "0.4", features = ["tokio"] }
tokio = { workspace = true }

[features]
default = ["vera"]
vera = []
dummy = []
bls12-381 = ["dep:crypto", "crypto/bls12-381"]
decaf377 = ["dep:crypto", "crypto/decaf377"]

[dev-dependencies]
serial_test = "3.2.0"
tokio = { workspace = true, features = ["full", "process"] }
# Vera-backend tests use common's Docker integration harness (VeraTestContainer).
common = { path = "../common", features = ["test-harness"] }
[lints]
workspace = true
