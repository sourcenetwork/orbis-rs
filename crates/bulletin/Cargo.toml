[package]
name = "bulletin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
orbis-reporting = { path = "../reporting" }
async-trait = { workspace = true }
thiserror ={ workspace = true }
common = { path = "../common" }
crypto = { path = "../crypto", optional = true, default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
backoff = { version = "0.4", features = ["tokio"] }
tokio = { workspace = true }

commonware-codec = { version = "2026.9.0", optional = true }
url = { version = "2.5", optional = true }
vera-client = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2", optional = true }
vera-domain = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2", optional = true }
alloy-primitives = { version = "1", optional = true }
k256 = { workspace = true, optional = true }
local-storage = { path = "../local-storage", optional = true }
zeroize = { workspace = true, optional = true }

[features]
default = ["vera"]
vera = []
native = ["dep:commonware-codec", "dep:url", "dep:vera-client", "dep:vera-domain", "dep:alloy-primitives", "dep:k256", "dep:local-storage", "dep:zeroize"]
# Selects `DummyBulletin` as the production `BulletinImpl` (mutually
# exclusive with `vera`, enforced below). Implies `dummy-type` since that's
# what actually compiles the module this re-exports.
dummy = ["dummy-type"]
# Compiles the `dummy` module (an in-memory mock, no chain) without
# selecting it as `BulletinImpl` — for a `vera`-backed binary (orbis-node,
# orbis-bench) that still wants `DummyBulletin` available for an in-process
# test/benchmark harness. Split from `dummy` so enabling it can't trip the
# `vera`+`dummy` mutual-exclusivity check below.
dummy-type = []
bls12-381 = ["dep:crypto", "crypto/bls12-381"]
decaf377 = ["dep:crypto", "crypto/decaf377"]

[[test]]
name = "native_service"
required-features = ["native"]

[dev-dependencies]
vera-harness = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
vera-crypto = { git = "https://github.com/sourcenetwork/vera.rs", rev = "cf6bbe9ad5c2a4f7ad6ffea5647bf81dd13f84d2" }
blst = "0.3"
commonware-math = "2026.9.0"
tempfile.workspace = true
serial_test = "3.2.0"
tokio = { workspace = true, features = ["full", "process"] }
# Vera-backend tests use the Docker integration harness (VeraTestContainer).
test-support = { path = "../test-support" }
[lints]
workspace = true
