[package]
name = "bulletin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
orbis-reporting = { path = "../reporting" }
async-trait = { workspace = true }
thiserror ={ workspace = true }
common = { path = "../common", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
backoff = { version = "0.4", features = ["tokio"] }
tokio = { workspace = true }
tracing = "0.1"
authz = { path = "../authz", default-features = false }

vera-crypto = { workspace = true, optional = true }
vera-client = { workspace = true, optional = true }
vera-domain = { workspace = true, optional = true }
vera-modules = { workspace = true, optional = true }
alloy-sol-types = { version = "1", optional = true }
alloy-primitives = { version = "1", optional = true }
k256 = { workspace = true, optional = true }
local-storage = { path = "../local-storage", optional = true, default-features = false }
getrandom = { version = "0.2", features = ["std"], optional = true }
zeroize = { workspace = true, optional = true }

[features]
default = ["vera"]
# Selects deterministic identity startup. This is deliberately separate from the
# node's dangerous `unsafe-testing` diagnostic surface.
fixture-startup = []
vera = ["common/vera", "dep:vera-client", "dep:vera-domain", "dep:vera-crypto", "dep:alloy-primitives", "dep:alloy-sol-types", "dep:vera-modules", "dep:k256", "dep:local-storage", "dep:zeroize", "dep:getrandom"]
# Compiles the in-memory mock type without selecting it as the production
# implementation. Used by in-process tests and benchmarks.
dummy-type = []
# The `BulletinFactory`/`PreparedBulletin` traits, the services composer and
# factory impl. Separate from `vera` (which just compiles the backend module
# for direct use — `cli-tool`'s admin tooling needs it without ever touching
# a factory). Implies `authz/startup` since the composer references
# `authz::startup::{AuthzFactory, PreparedAuthz}` directly.
startup = ["common/startup", "authz/startup"]
# Select `BulletinFactoryImpl`. Implies `startup` since selecting it *is*
# constructing a factory.
select-vera = ["vera", "startup"]

[[test]]
name = "vera_service"
required-features = ["vera"]

[dev-dependencies]
common = { path = "../common", default-features = false, features = ["test-helpers"] }
alloy-sol-types = "1"
vera-acp = { workspace = true }
vera-modules = { workspace = true }
vera-harness = { workspace = true }
blst = "0.3"
commonware-math = "=2026.10.0"
tempfile.workspace = true
serial_test = "3.2.0"
tokio = { workspace = true, features = ["full", "process"] }
local-storage = { path = "../local-storage", features = ["redb"] }
[lints]
workspace = true
