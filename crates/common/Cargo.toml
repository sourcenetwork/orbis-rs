[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true, optional = true }
hex = { workspace = true }
base64 = { workspace = true, optional = true }

# Blockchain / Cosmos SDK
cosmrs = { workspace = true, optional = true }
tendermint = { workspace = true, optional = true }
tendermint-rpc = { workspace = true, optional = true }
tendermint-reqwest = { package = "reqwest", version = "0.11.20", default-features = false, features = ["rustls-tls-native-roots"], optional = true }
reqwest = { workspace = true, optional = true }
bip32 = { workspace = true, optional = true }
k256 = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
backoff = { version = "0.4", features = ["tokio"], optional = true }
futures = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }

[features]
default = ["cosmos"]
# Chain configuration, transaction signing, and Cosmos SDK / CometBFT transport.
# Shared wire types, object IDs, and node message signatures need no feature.
cosmos = [
    "dep:tokio",
    "dep:async-trait",
    "dep:base64",
    "dep:cosmrs",
    "dep:tendermint",
    "dep:tendermint-rpc",
    "dep:tendermint-reqwest",
    "dep:reqwest",
    "dep:bip32",
    "dep:tonic",
    "dep:rand",
    "dep:backoff",
    "dep:futures",
    "dep:tokio-tungstenite",
]
bls12-381 = []
jubjub = []

[lints]
workspace = true
