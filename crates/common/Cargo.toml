[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# Blockchain / Cosmos SDK
cosmrs = { workspace = true }
tendermint = { workspace = true }
tendermint-rpc = { workspace = true }
tendermint-reqwest = { package = "reqwest", version = "0.11.20", default-features = false, features = ["rustls-tls-native-roots"] }
reqwest = { workspace = true }
bip32 = { workspace = true }
k256 = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
rand = { workspace = true }
backoff = { version = "0.4", features = ["tokio"] }
tempfile = { workspace = true, optional = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }

[features]
default = []
bls12-381 = []
decaf377 = []
# Docker Compose integration-test harness (see src/test_harness.rs). Enabled by
# orbis-node's `integration-test` feature; excluded from the production build.
test-harness = ["dep:tempfile"]

[dev-dependencies]
serial_test = "3.2.0"
[lints]
workspace = true
