syntax = "proto3";

package dkg_service;

service DkgService {
  rpc StartDkg(StartDkgRequest) returns (StartDkgResponse);
}

message StartDkgRequest {
  uint32 threshold = 2;
  repeated string peer_ids = 3;  // Iroh peer IDs that this node needs to connect to
  optional uint64 pss_interval = 4;  // Seconds between automatic PSS refresh ceremonies (absent = disabled; present 0 = immediate)
  optional string policy_id = 5;  // Optional policy that externally governs ring updates
  string namespace = 6;  // Bulletin namespace for this ring
  string ring_id = 7;  // Pre-created blank ring entry targeted by this DKG
}

message StartDkgResponse {
  string session_id = 1;
  string status = 2;
  string message = 3;
  int64 created_at = 4;
}
