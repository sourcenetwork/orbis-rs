syntax = "proto3";

package dkg_service;

service DkgService {
  rpc StartDkg(StartDkgRequest) returns (StartDkgResponse);
}

message StartDkgRequest {
  uint32 threshold = 2;
  repeated string peer_ids = 3;  // Iroh peer IDs that this node needs to connect to
  optional uint64 pss_interval = 4;  // Seconds between automatic PSS refresh ceremonies (0 / absent = disabled)
  string namespace = 5;  // Bulletin namespace for this ring
}

message StartDkgResponse {
  string session_id = 1;
  string status = 2;
  string message = 3;
  int64 created_at = 4;
}
