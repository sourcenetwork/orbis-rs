syntax = "proto3";

package dkg_service;

service DkgService {
  rpc StartDkg(StartDkgRequest) returns (StartDkgResponse);
}

message StartDkgRequest {
  string ring_id = 1;  // Pre-created blank ring entry targeted by this DKG
}

message StartDkgResponse {
  string session_id = 1;
  string status = 2;
  string message = 3;
  int64 created_at = 4;
}
