syntax = "proto3";

package orbis.unsafe_testing;

import "v0/pre_service.proto";

service UnsafeTestingService {
  rpc GetLocalStorage(GetLocalStorageRequest) returns (GetLocalStorageResponse);
  rpc SetLocalStorage(SetLocalStorageRequest) returns (SetLocalStorageResponse);
  rpc DeleteLocalStorage(DeleteLocalStorageRequest) returns (DeleteLocalStorageResponse);
  rpc GetActivePssSession(GetActivePssSessionRequest) returns (GetActivePssSessionResponse);
  rpc SubmitDkgInvalidShareEvidence(SubmitDkgInvalidShareEvidenceRequest) returns (SubmitDkgInvalidShareEvidenceResponse);
  rpc SubmitDkgEquivocationEvidence(SubmitDkgEquivocationEvidenceRequest) returns (SubmitDkgEquivocationEvidenceResponse);
  rpc SubmitDkgInvalidRefreshCommitmentEvidence(SubmitDkgInvalidRefreshCommitmentEvidenceRequest) returns (SubmitDkgInvalidRefreshCommitmentEvidenceResponse);
  rpc SubmitPssStallOfflineReport(SubmitPssStallOfflineReportRequest) returns (SubmitPssStallOfflineReportResponse);
  rpc SubmitUnauthorizedRelayEvidence(SubmitUnauthorizedRelayEvidenceRequest) returns (SubmitUnauthorizedRelayEvidenceResponse);
  rpc SubmitOrganicConflictingCommitment(SubmitOrganicConflictingCommitmentRequest) returns (SubmitOrganicConflictingCommitmentResponse);
  rpc SubmitOrganicNoncanonicalPrepare(SubmitOrganicNoncanonicalPrepareRequest) returns (SubmitOrganicNoncanonicalPrepareResponse);
  rpc SubmitOrganicConflictingManifest(SubmitOrganicConflictingManifestRequest) returns (SubmitOrganicConflictingManifestResponse);
  rpc SubmitOrganicInvalidRefreshResult(SubmitOrganicInvalidRefreshResultRequest) returns (SubmitOrganicInvalidRefreshResultResponse);
}

enum LocalStorageKeyType {
  LOCAL_STORAGE_KEY_TYPE_UNSPECIFIED = 0;
  LOCAL_STORAGE_KEY_TYPE_RING_INDEX = 1;
  LOCAL_STORAGE_KEY_TYPE_RING_KEY = 2;
  LOCAL_STORAGE_KEY_TYPE_NODE_SECRET_KEY = 3;
  LOCAL_STORAGE_KEY_TYPE_NODE_SIGNING_KEY = 4;
}

enum LocalStorageAccessMode {
  LOCAL_STORAGE_ACCESS_MODE_UNSPECIFIED = 0;
  LOCAL_STORAGE_ACCESS_MODE_PLAIN = 1;
  LOCAL_STORAGE_ACCESS_MODE_ENCRYPTED = 2;
}

message LocalStorageKey {
  LocalStorageKeyType key_type = 1;
  string ring_key = 2;
}

message GetLocalStorageRequest {
  LocalStorageKey key = 1;
  LocalStorageAccessMode access_mode = 2;
}

message GetLocalStorageResponse {
  bool found = 1;
  bytes value = 2;
}

message SetLocalStorageRequest {
  LocalStorageKey key = 1;
  LocalStorageAccessMode access_mode = 2;
  bytes value = 3;
}

message SetLocalStorageResponse {}

message DeleteLocalStorageRequest {
  LocalStorageKey key = 1;
}

message DeleteLocalStorageResponse {
  bool existed = 1;
}

message GetActivePssSessionRequest {
  string ring_pk = 1;
}

message GetActivePssSessionResponse {
  bool found = 1;
  string session_id = 2;
  // True once the session's transport control handshake has completed
  // (Prepare/Prepared/Activate/Activated) — `found` alone only means the
  // session was claimed, not that it's far enough along to accept a public
  // contribution (`submit_public_contribution` rejects those pre-activation).
  bool activated = 3;
}

message SubmitDkgInvalidShareEvidenceRequest {
  string session_id = 1;
  bytes signed_share_json = 2;
}

message SubmitDkgInvalidShareEvidenceResponse {}

message SubmitDkgEquivocationEvidenceRequest {
  string session_id = 1;
  bytes commitment_a_json = 2;
  bytes commitment_b_json = 3;
}

message SubmitDkgEquivocationEvidenceResponse {}

message SubmitDkgInvalidRefreshCommitmentEvidenceRequest {
  string session_id = 1;
  bytes signed_commitment_json = 2;
}

message SubmitDkgInvalidRefreshCommitmentEvidenceResponse {}

// Injects an AbandonedPssSession through the real PSS stall-report path (drain worker logic),
// attributing `peer_id` as a silent dealer. Used to test the stall/offline->node_offline flow
// deterministically: the accused must be genuinely stopped so the co-signer reachability probe
// passes and the report is accepted. Refresh by default; set `new_peer_node_keys` (non-empty) to
// attribute a reshare session instead, in which case `new_threshold` and `bulletin_post_id` must
// also be set to valid values — the server passes all three straight through into the reshare
// session kind without validating them.
message SubmitPssStallOfflineReportRequest {
  string ring_id = 1;
  string session_id = 2;
  string peer_id = 3;
  string ring_pk_hex = 4;
  repeated string new_peer_node_keys = 5;
  uint32 new_threshold = 6;
  string bulletin_post_id = 7;
}

message SubmitPssStallOfflineReportResponse {}

// Makes this node forward a relayer-signed PRE/Sign request to a target peer through the real
// network path. The target peer should reject the unauthorized request and report this relayer.
message SubmitUnauthorizedRelayEvidenceRequest {
  bytes relay_statement_canonical_bytes = 1;
  bytes relay_signature = 2;
  string target_peer_id = 3;
  string token_string = 4;
  bytes pre_reader_pk = 5;
  // When set (origin_protocol "pre" only), the target node treats the request's document as
  // supplied inline instead of resolving object_id via bulletin.read — mirrors
  // StartPreRequest.document. The relay statement must have document_inline set; the target node
  // re-derives object_id from this document when it reports, and carries it to co-signers
  // out-of-band (never on chain).
  optional orbis.v0.pre.InlineDocument inline_document = 6;
}

message SubmitUnauthorizedRelayEvidenceResponse {}

// Makes this node broadcast a second, conflicting Phase1 commitment for its own slot in the given
// live ceremony, through the real public-contribution path (the same functions the honest Phase1
// flow uses) — organically exercising the *other* committee members' real equivocation detection
// (`record_public_batch`'s ConflictingDuplicate path) instead of injecting pre-verified evidence
// directly. Requires this node to have already broadcast its real first commitment for the
// session, so the two share the session's fixed `session_nonce` and differ only in content.
message SubmitOrganicConflictingCommitmentRequest {
  string session_id = 1;
  bytes commitment_bytes = 2;
}

message SubmitOrganicConflictingCommitmentResponse {}

// Makes this node build, sign, and broadcast a real refresh Prepare as if it were the canonical
// current-committee leader, through the real coordination path minus the one leader-identity check
// — organically exercising the *other* committee members' real `leader_prepare_fault` detection
// instead of injecting evidence directly. No membership check is added here: callers should target a
// genuine (non-canonical) committee member to exercise the intended fault. Fails if PSS refresh is
// not yet due for the ring (see `pss_interval`).
message SubmitOrganicNoncanonicalPrepareRequest {
  string ring_id = 1;
  string ring_pk = 2;
}

message SubmitOrganicNoncanonicalPrepareResponse {}

// Makes this node (the real canonical leader) broadcast a second, conflicting Phase1-Commitments
// manifest for a live ceremony it has already published the real manifest for: same phase_root and
// contribution_ids (recomputed from the same real retained contributions, so it passes the
// receiver's own self-consistency check), but a different chunk_count — organically exercising the
// *other* committee members' real `dkg_leader_equivocation` detection (`PublicBatchAssembler::
// insert_manifest`) instead of injecting evidence directly. Requires this node to have already
// published the real manifest for the phase (so there is something on the wire to conflict with),
// and requires at least 2 retained contributions (so a different, still-valid chunk_count exists).
message SubmitOrganicConflictingManifestRequest {
  string session_id = 1;
}

message SubmitOrganicConflictingManifestResponse {}

// Makes this node (the real canonical refresh leader) broadcast a real RefreshHealthCheckResult
// whose parameters (ring_pk, threshold, total_participants, peer_node_keys_sha256) match its own
// real staged candidate — so it passes the receiver's coarse candidate-match check — but whose
// public_polynomial_sha256 is wrong, and whose signature is a syntactically-valid placeholder rather
// than a real threshold signature over the (wrong) statement. This organically exercises the *other*
// committee members' real content-mismatch rejection (`verify_result_signature`, which compares
// statement fields against the receiver's own independently-staged candidate before ever touching
// the signature bytes) instead of injecting evidence directly. Requires this node to have already
// reached the RefreshHealthCheck phase (i.e. staged its own real candidate).
message SubmitOrganicInvalidRefreshResultRequest {
  string session_id = 1;
}

message SubmitOrganicInvalidRefreshResultResponse {}
