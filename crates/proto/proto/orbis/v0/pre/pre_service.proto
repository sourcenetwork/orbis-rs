syntax = "proto3";

package orbis.v0.pre;

service PreService {
  rpc StartPre(StartPreRequest) returns (StartPreResponse);
}

message TimestampRange {
  uint64 start = 1;
  uint64 end = 2;
}

// The document, in full, supplied directly by the caller instead of already being on the
// bulletin. object_id must equal generate_document_id(ring_id, encrypted_document, proof,
// policy_id, resource, permission, tier, timestamp) — nodes recompute and check this locally
// before doing anything else with the request.
message InlineDocument {
  string ring_id = 1;
  // The pre-encrypted document (serialized Secret struct from crypto crate).
  // Same shape as StoreSecretRequest.encrypted_document.
  bytes encrypted_document = 2;
  // The encryption commitment (compressed G1 point from encryption)
  bytes enc_cmt = 3;
  string policy_id = 4;
  string resource = 5;
  string permission = 6;
  // Field 7 was `bytes shared_point` (the KEM shared secret). Removed: the
  // encryption proof no longer publishes it. The ciphertext-binding context is
  // rebuilt by verifiers from the surrounding fields.
  reserved 7;
  reserved "shared_point";
  // Challenge for encryption proof (Schnorr PoK)
  bytes challenge = 8;
  // Response for encryption proof (Schnorr PoK)
  bytes response = 9;
  optional string tier = 10;
  optional uint64 timestamp = 11;
}

message StartPreRequest {
  // reader public key
  bytes rdr_pk = 1;
  // Object Id should be the only one not on bulletin but passed in here
  string object_id = 2;
  // Optional derivation path
  optional bytes derivation = 3;
  // Optional salt for proof
  optional string salt = 4;
  // Optional timestamp range for validity window
  // TODO: Insecure test code meant to be moved to acp eventually (not in authn either)
  optional TimestampRange valid_window = 5;
  // When set, the document is taken from here instead of read from the bulletin by object_id.
  optional InlineDocument document = 6;
}

message StartPreResponse {
  string status = 1;
  string message = 2;
  int64 created_at = 3;
  bytes encrypted_secret = 4;
}
