syntax = "proto3";

package orbis.v0.pre;

service PreService {
  rpc StartPre(StartPreRequest) returns (StartPreResponse);
}

message TimestampRange {
  uint64 start = 1;
  uint64 end = 2;
}

// PET ownership-tag ciphertext and its knowledge proof, carried alongside a
// document only on a ring that requires PET. Not yet enforced: no PET ring
// can exist yet, and this attachment is not included in authorization.
// Presence is all-or-nothing — a caller cannot supply only some of these
// fields; nodes reject a document whose attachment is only partially decoded.
message PetTagAttachment {
  // R = r_tag * G (compressed group point).
  bytes ephemeral_point = 1;
  // T = F(owner_id) + r_tag * pet_pk (compressed group point).
  bytes masked_fingerprint = 2;
  // Tag-knowledge-proof challenge (Schnorr PoK of r_tag).
  bytes knowledge_proof_challenge = 3;
  // Tag-knowledge-proof response.
  bytes knowledge_proof_response = 4;
}

// The document, in full, supplied directly by the caller instead of already being on the
// bulletin. object_id must equal generate_document_id(ring_id, encrypted_document, proof,
// policy_id, resource, permission, tier, timestamp, pet_tag) — nodes recompute and check this
// locally before doing anything else with the request.
message InlineDocument {
  string ring_id = 1;
  // The pre-encrypted document (serialized Secret struct from crypto crate).
  // Same shape as StoreSecretRequest.encrypted_document.
  bytes encrypted_document = 2;
  // The encryption commitment (compressed G1 point from encryption)
  bytes enc_cmt = 3;
  string policy_id = 4;
  string resource = 5;
  string permission = 6;
  // Challenge for the encryption proof (Schnorr PoK of the encryption randomness).
  bytes challenge = 7;
  // Response for the encryption proof.
  bytes response = 8;
  optional string tier = 9;
  optional uint64 timestamp = 10;
  // PET tag, present only when the ring requires PET.
  optional PetTagAttachment pet_tag = 11;
}

// Schnorr signature of knowledge of the discrete log of a StartPreRequest.rdr_pk
// (i.e. that the caller knows rdr_sk such that rdr_pk = rdr_sk*G), over a
// request-bound transcript (chain id, authenticated JWT claims, object_id,
// rdr_pk, derivation, salt, valid window — never the ciphertext itself).
// Required so that xnc_ski = ski*(rdr_pk + enc_cmt), which is linear in
// rdr_pk, cannot be redirected toward an unrelated ciphertext by submitting a
// difference of two published commitments as rdr_pk, and so a valid
// signature from one request cannot be replayed into a different request.
// Separate valid signatures do not make recipient-key reuse safe: the
// StartPreRequest.rdr_pk lifetime requirement still applies.
//
// This signature itself is the only part carried on the wire, as
// StartPreRequest.rdr_pk_signature. The transcript it signs is not: every
// responder (not only the ingress node) independently rebuilds that
// transcript from its own already-authenticated JWT and already-resolved
// ring/document state, then verifies this signature against its own
// rebuilt transcript — never one supplied by another node.
message ReaderAuthorizationSignature {
  bytes challenge = 1;
  bytes response = 2;
}

// A WebAuthn assertion (`navigator.credentials.get()` output) authorizing a
// PRE decrypt request in place of a JWT. The passkey's own credential
// public key is the identity: `issuer_did` is the `did:key` it decodes to,
// and ACP grants/revokes that DID directly — there is no separate
// enrollment registry. `issued_at`/`expiry`/`nonce` complete the exact
// operation the assertion's `client_data_json.challenge` must commit to
// (alongside this request's own `object_id`/`rdr_pk`/`derivation`/`salt`).
// `issued_at` matters here specifically (unlike it would for a protocol
// with no further use for it): it becomes this request's synthetic
// token's `issued_time`, which `ReaderAuthorizationSignature` ends up
// cryptographically binding into its own transcript — see
// `orbis_webauthn::WebAuthnEvidence`'s doc comment for why that has to be
// client-chosen rather than derived at verification time. Same shape as
// `orbis.v0.sign.WebAuthnAssertion` — kept as its own message per service
// rather than a shared import, matching this file's own `TimestampRange`
// precedent. See `orbis_integration_core::PreOperation`.
message WebAuthnAssertion {
  string issuer_did = 1;
  bytes authenticator_data = 2;
  bytes client_data_json = 3;
  bytes signature = 4;
  uint64 issued_at = 5;
  uint64 expiry = 6;
  bytes nonce = 7;
}

// DKIM-verified email evidence authorizing a PRE decrypt request in place
// of a JWT. Unlike `WebAuthnAssertion`, the identity is not declared up
// front — the node independently extracts and DMARC-aligns the `From:`
// address from `raw_message` itself; `claimed_address` is only a sanity
// check against that. `issued_at`/`expiry`/`nonce` complete the exact
// operation the DKIM-verified body's reply code must commit to (alongside
// this request's own `object_id`/`rdr_pk`/`derivation`/`salt`); `issued_at`
// matters here specifically for the same reason it does for
// `WebAuthnAssertion` — see that message's own doc comment. See
// `orbis_email::EmailEvidence`/`orbis_integration_core::PreOperation`.
message EmailAssertion {
  string claimed_address = 1;
  bytes raw_message = 2;
  uint64 issued_at = 3;
  uint64 expiry = 4;
  bytes nonce = 5;
}

message StartPreRequest {
  // Ephemeral recipient public key for this PRE operation, on either backend.
  // Clients MUST generate a fresh, independent keypair for each new operation;
  // never reuse it across requests/documents or supply a long-lived identity key.
  // Keep the private key only until this operation's decryption is complete or
  // abandoned, then erase and discard it. Reuse under the same ring key can
  // expose another document's encryption key to a coordinator that knows one
  // document's encryption randomness and observes both PRE responses. Fresh JWT
  // IDs and request signatures do not prevent this. The service does not enforce
  // key non-reuse.
  bytes rdr_pk = 1;
  // Object Id should be the only one not on bulletin but passed in here
  string object_id = 2;
  // Optional derivation path
  optional bytes derivation = 3;
  // Optional salt for proof
  optional string salt = 4;
  // Optional timestamp range for validity window
  // TODO: Insecure test code meant to be moved to acp eventually (not in authn either)
  optional TimestampRange valid_window = 5;
  // When set, the document is taken from here instead of read from the bulletin by object_id.
  optional InlineDocument document = 6;
  // Signature of knowledge of rdr_pk's discrete log, bound to this request.
  ReaderAuthorizationSignature rdr_pk_signature = 7;
  // The ACP object being audited, required on a ring that requires PET. Not yet
  // enforced: no PET ring can exist yet, and this field is not checked against
  // ACP or bound in authorization. Distinct from object_id, which keeps its
  // current document-identity meaning.
  optional string audit_target_object_id = 8;
  // Passkey-authorized decryption: present instead of a bearer JWT.
  // Mutually exclusive with the JWT path in practice (a request
  // authenticated this way carries no Authorization header), not enforced
  // by the message shape itself.
  optional WebAuthnAssertion webauthn_assertion = 9;
  // Email-authorized decryption: same mutual-exclusivity note as
  // `webauthn_assertion` applies, also with respect to that field.
  optional EmailAssertion email_assertion = 10;
}

message StartPreResponse {
  string status = 1;
  string message = 2;
  int64 created_at = 3;
  bytes encrypted_secret = 4;
}
