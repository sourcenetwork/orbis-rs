syntax = "proto3";

package orbis.v0.sign;

service SignService {
  rpc StartSign(StartSignRequest) returns (StartSignResponse);
}

message TimestampRange {
  uint64 start = 1;
  uint64 end = 2;
}

// A WebAuthn assertion (`navigator.credentials.get()` output) authorizing a
// Sign request in place of a JWT. The passkey's own credential public key
// is the identity: `issuer_did` is the `did:key` it decodes to, and ACP
// grants/revokes that DID directly — there is no separate enrollment
// registry. `expiry`/`nonce` complete the exact operation the assertion's
// `client_data_json.challenge` must commit to (alongside this request's own
// `derivation_id`/`message` and the derivation's live ring_id); every other
// field of that commitment is already present on `StartSignRequest`, so it
// is never caller-suppliable. See `orbis_integration_core::SignOperation`.
message WebAuthnAssertion {
  string issuer_did = 1;
  bytes authenticator_data = 2;
  bytes client_data_json = 3;
  bytes signature = 4;
  uint64 expiry = 5;
  bytes nonce = 6;
}

message StartSignRequest {
  // Raw bytes to sign
  bytes message = 1;
  // Object ID of the KeyDerivation entry on the bulletin
  string derivation_id = 2;
  // Optional timestamp range for validity window
  optional TimestampRange valid_window = 3;
  // Passkey-authorized signing: present instead of a bearer JWT. Mutually
  // exclusive with the JWT path in practice (a request authenticated this
  // way carries no Authorization header), not enforced by the message
  // shape itself.
  optional WebAuthnAssertion webauthn_assertion = 4;
}

message StartSignResponse {
  string status = 1;
  string message = 2;
  int64 created_at = 3;
  // Hex-encoded recovered threshold signature
  string signature = 4;
}
