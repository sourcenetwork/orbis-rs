syntax = "proto3";

package orbis.v0.sign;

service SignService {
  rpc SignShielddAuditRegistration(SignShielddAuditRegistrationRequest) returns (StartSignResponse);
  rpc EvaluateShielddAuditKey(EvaluateShielddAuditKeyRequest) returns (EvaluateShielddAuditKeyResponse);
  rpc StartSign(StartSignRequest) returns (StartSignResponse);
}

message TimestampRange {
  uint64 start = 1;
  uint64 end = 2;
}

message StartSignRequest {
  // Raw bytes to sign
  bytes message = 1;
  // Object ID of the KeyDerivation entry on the bulletin
  string derivation_id = 2;
  // Optional timestamp range for validity window
  optional TimestampRange valid_window = 3;
}

message StartSignResponse {
  string status = 1;
  string message = 2;
  int64 created_at = 3;
  // Hex-encoded recovered threshold signature
  string signature = 4;
}

message EvaluateShielddAuditKeyRequest {
  bytes identity_json = 1;
  bytes session = 2;
}

message EvaluateShielddAuditKeyResponse {
  bytes evaluation_json = 1;
}

message SignShielddAuditRegistrationRequest {
  bytes registration_json = 1;
  bytes evaluations_json = 2;
}
