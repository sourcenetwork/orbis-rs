syntax = "proto3";

package orbis.v0.store_secret;

service StoreSecretService {
  rpc StoreSecret(StoreSecretRequest) returns (StoreSecretResponse);
}

// PET ownership-tag ciphertext and its knowledge proof, carried alongside a
// document only on a ring that requires PET. Not yet enforced: no PET ring
// can exist yet, and this attachment is not included in authorization.
// Presence is all-or-nothing — a caller cannot supply only some of these
// fields; nodes reject a document whose attachment is only partially decoded.
message PetTagAttachment {
  // R = r_tag * G (compressed group point).
  bytes ephemeral_point = 1;
  // T = F(owner_id) + r_tag * pet_pk (compressed group point).
  bytes masked_fingerprint = 2;
  // Tag-knowledge-proof challenge (Schnorr PoK of r_tag).
  bytes knowledge_proof_challenge = 3;
  // Tag-knowledge-proof response.
  bytes knowledge_proof_response = 4;
}

message StoreSecretRequest {
  // The ENCRYPTED document (serialized Secret struct from crypto crate)
  // User must encrypt locally using the ring's public key before calling this service
  bytes encrypted_document = 1;
  // The encryption commitment (compressed G1 point from encryption)
  bytes enc_cmt = 2;
  // Ring ID to identify which ring was used for encryption
  string ring_id = 3;
  // Policy ID for access control
  string policy_id = 4;
  // Resource type for the policy
  string resource = 5;
  // Permission required for the policy
  string permission = 6;
  // Challenge for the encryption proof (Schnorr PoK of the encryption randomness).
  bytes challenge = 7;
  // Response for the encryption proof.
  bytes response = 8;
  // Return a signature from the DKG key as proof of storage
  bool with_proof = 9;
  // tier for the policy
  optional string tier = 10;
  // timestamp for the policy
  optional uint64 timestamp = 11;
  // PET tag, present only when the ring requires PET.
  optional PetTagAttachment pet_tag = 12;
}

message StoreSecretResponse {
  string status = 1;
  string message = 2;
  int64 created_at = 3;
  // The object_id (bulletin post ID) for referencing in PRE requests
  string object_id = 4;
  // The ring_id used for encryption (echoed back for convenience)
  string ring_id = 5;
  // Signature of ring if requested
  string signature = 6;
}
