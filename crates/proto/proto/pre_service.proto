syntax = "proto3";

package pre_service;

service PreService {
  rpc StartPre(StartPreRequest) returns (StartPreResponse);
}

message StartPreRequest {
  string ring_pk = 1;
  string secret = 2;
  string rdr_pk = 3;
  repeated string peer_ids = 5;  // Iroh peer IDs that this node needs to connect to
}

message StartPreResponse {
  string status = 2;
  string message = 3;
  int64 created_at = 4;
  string encrypted_secret = 5;
}
