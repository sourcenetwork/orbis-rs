syntax = "proto3";

package pre_service;

service PreService {
  rpc StartPre(StartPreRequest) returns (StartPreResponse);
}

message StartPreRequest {
  // reader public key
  string rdr_pk = 1;
  // Object Id should be the only one not on bulletin but passed in here
  string object_id = 2;
  // object's namespace
  string namespace = 3;
}

message StartPreResponse {
  string status = 2;
  string message = 3;
  int64 created_at = 4;
  string encrypted_secret = 5;
}
