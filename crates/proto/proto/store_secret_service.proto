syntax = "proto3";

package store_secret_service;

service StoreSecretService {
  rpc StoreSecret(StoreSecretRequest) returns (StoreSecretResponse);
}

message StoreSecretRequest {
  // The ENCRYPTED document (JSON-serialized Secret struct from crypto crate)
  // User must encrypt locally using the ring's public key before calling this service
  string encrypted_document = 1;
  // The encryption commitment (hex-encoded G1 point from encryption)
  string enc_cmt = 2;
  // Ring ID to identify which ring was used for encryption
  string ring_id = 3;
  // Namespace for storing the document on bulletin
  string namespace = 4;
  // Policy ID for access control
  string policy_id = 5;
  // Resource type for the policy
  string resource = 6;
  // Permission required for the policy
  string permission = 7;
  // Shared point for encryption proof
  bytes shared_point = 8;
  // challenge for encryption proof
  bytes challenge = 9;
  // Response for encryption proof
  bytes response = 10;
  // Return a signature from the DKG key as proof of storage
  bool with_proof = 11;
}

message StoreSecretResponse {
  string status = 1;
  string message = 2;
  int64 created_at = 3;
  // The object_id (bulletin post ID) for referencing in PRE requests
  string object_id = 4;
  // The ring_id used for encryption (echoed back for convenience)
  string ring_id = 5;
  // Signature of ring if requested
  string signature =6;
}
