[package]
name = "test-support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Docker Compose integration-test harness; consumed only as a dev-dependency.

[dependencies]
common = { path = "../common", default-features = false }
# Plain generated gRPC types/client only (tonic/tonic-prost/prost, no crypto-
# feature coupling) — used by `node_readiness` to poll `InfoService`.
# Deliberately not `cli-tool`: its default features hardcode a crypto
# implementation, which would conflict with a jubjub build's feature
# unification.
proto = { path = "../proto" }
tonic = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }

commonware-codec = { version = "=2026.10.0", optional = true }
vera-client = { workspace = true, optional = true }
vera-harness = { workspace = true, optional = true }
vera-node = { workspace = true, optional = true }

[features]
default = ["vera"]
vera = ["dep:commonware-codec", "dep:vera-client", "dep:vera-harness", "dep:vera-node"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
