[package]
name = "test-support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish = false

# Docker Compose integration-test harness; consumed only as a dev-dependency.

[dependencies]
common = { path = "../common", default-features = false }
# Plain generated gRPC types/client only (tonic/tonic-prost/prost, no crypto-
# feature coupling) — used by `node_readiness` to poll `InfoService` for both
# backends. Deliberately not `cli-tool` (its default features hardcode a
# crypto implementation, which would conflict with a jubjub build's feature
# unification — see `admin/cosmos.rs`'s doc comment for why ring creation
# stays out of this crate for the same reason).
proto = { path = "../proto" }
tonic = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }

bs58 = { version = "0.5", optional = true }
commonware-codec = { version = "2026.9.0", optional = true }
vera-client = { workspace = true, optional = true }
vera-harness = { workspace = true, optional = true }
vera-node = { workspace = true, optional = true }

[features]
default = ["cosmos"]
# Cosmos/SourceHub backend: `CosmosNetwork`/`CosmosAdmin`, driven by `common`'s
# Cosmos chain client. Kept the default so `authz`/`bulletin`'s existing
# `test-support = { path = "..." }` dev-dependencies (no `default-features =
# false`) keep getting it without a Cargo.toml change on their side.
cosmos = ["common/cosmos", "dep:bs58"]
native = ["dep:commonware-codec", "dep:vera-client", "dep:vera-harness", "dep:vera-node"]

[[test]]
name = "blockchain_vera"
required-features = ["cosmos"]

[[test]]
name = "native_validators"
required-features = ["native"]

[dev-dependencies]
# `tests/blockchain_vera.rs` — live-chain tests for common's VeraClient/TxSigner.
tokio = { workspace = true }
serial_test = "3.2.0"
cosmrs = { workspace = true }
prost = { workspace = true }

[lints]
workspace = true
