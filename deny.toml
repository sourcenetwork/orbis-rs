# cargo-deny configuration
# Run: cargo deny check
# Install: cargo install cargo-deny

[graph]
all-features = false

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
# Anything not in the allow list is denied by default.
# OR-expressions are evaluated lazily — if Apache-2.0 or MIT appears in the
# expression, the crate passes even if GPL also appears (e.g. self_cell).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",   # Boost Software License (permissive) — used by ryu via serde_json
    "MPL-2.0",   # file-level copyleft only; we don't modify these files.
                 # affects: attohttpc (via iroh→igd-next), option-ext (via dirs)
]

# Confidence threshold for license text scanning (when SPDX field is absent)
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Security advisories
# ---------------------------------------------------------------------------
[advisories]
unmaintained = "none"
yanked = "allow"
ignore = [
    # did-key 0.2.1 (the latest release; no 0.3/1.0 exists) pins ed25519-dalek
    # "1.0.1" and curve25519-dalek "3.x". Neither advisory has a fix inside
    # those majors — RUSTSEC-2022-0093 is fixed only in ed25519-dalek 2.x,
    # RUSTSEC-2024-0344 only in curve25519-dalek 4.1.3 — so a Cargo.lock bump
    # cannot clear them while did-key 0.2.1 is in the tree.
    #
    # Neither is reachable in how orbis-rs uses did-key (SEC-02, reviewed):
    #  - RUSTSEC-2022-0093 (double-pubkey signing oracle) needs the app to call
    #    ed25519-dalek's *signing* API with a caller-influenced public key. All
    #    JWT signing and verification here goes through jsonwebtoken -> ring;
    #    did-key touches ed25519-dalek only to derive a public key from a local
    #    32-byte seed (`generate`) and to parse a `did:key:` string (`resolve`).
    #    No signing call, no attacker-supplied public key.
    #  - RUSTSEC-2024-0344 (data-dependent timing in Scalar::sub) needs repeated
    #    secret-scalar operations an attacker can time. did-key's curve25519
    #    use here is one-shot keygen plus public-point decompression; the
    #    timing-sensitive signing path is ring, not dalek.
    # Removing did-key entirely (small hand-rolled did:key codec + ring for
    # keygen) stays the clean long-term fix; tracked as SEC-02.
    "RUSTSEC-2022-0093",
    "RUSTSEC-2024-0344",

    # tendermint-rpc 0.40.4 is the latest tendermint-rpc release and its
    # http-client feature still pins reqwest 0.11 / rustls 0.21.12 /
    # rustls-webpki 0.101.7. We removed its websocket-client feature and use
    # reqwest 0.12 elsewhere.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # h2 0.3.27, pulled in transitively by the same pinned reqwest 0.11 /
    # hyper 0.14 stack above (via tendermint-rpc's http-client feature) — no
    # patched 0.3.x release exists (fix landed only in 0.4.16, already picked
    # up by the newer h2 0.4.x line reqwest 0.12 resolves to elsewhere). Low
    # severity (unbounded empty DATA frames from a malicious peer). Revisit
    # alongside the other tendermint-rpc entries above.
    "RUSTSEC-2026-0258",
    # Same pinned rustls 0.21.12 / rustls-webpki 0.101.7 (via tendermint-rpc's
    # reqwest 0.11 / hyper-rustls 0.24.2), published after the entries above
    # were added — same root cause, same fix path (drop tendermint-rpc's
    # http-client feature, or wait for a tendermint-rpc release off reqwest 0.11).
    "RUSTSEC-2026-0346", # Debug impls for rustls client session values expose TLS secrets
    "RUSTSEC-2026-0349", # unauthenticated ServerHello can downgrade to classical key exchange
    "RUSTSEC-2026-0382", # rustls-webpki certificate verification may accept distrusted intermediates

    # crypto-bigint timing side-channel (RUSTSEC-2026-0387, fixed >=0.7.6),
    # reachable through two pinned paths that resolve to two different old
    # crypto-bigint versions, so a lockfile bump can't clear either:
    #  - crypto-bigint 0.4.9, via elliptic-curve 0.12.3 -> ecdsa 0.14.8 ->
    #    p256 0.11.1 -> did-key 0.2.1. Not reachable: did-key here only ever
    #    exercises its Ed25519 arm (see the did-key block above); the P256
    #    arm (and so this crypto-bigint path) is compiled in but never
    #    called.
    #  - crypto-bigint 0.5.5, via elliptic-curve 0.13.8 -> ecdsa 0.16.9 ->
    #    k256 0.13.4 -> cosmrs 0.22.0 (the latest cosmrs release). This path
    #    *is* live — cosmrs uses k256 for Cosmos tx/account secp256k1
    #    signing — and isn't accepted as unreachable, only as currently
    #    unfixable: our own workspace k256 pin can bump to 0.14.x (which
    #    pulls the fixed crypto-bigint 0.7.x) independently, but cosmrs
    #    0.22.0 still pins k256 "^0.13" internally, so the vulnerable
    #    version stays in the tree regardless until cosmrs releases against
    #    a newer k256. Revisit when it does.
    "RUSTSEC-2026-0387",

    # zstd/zstd-safe (fixed in zstd >=0.14.3, zstd-safe >=8.2.0) via
    # commonware-storage's journal frame compression — the only path either
    # crate has in this tree, and pinned by commonware-storage's own
    # workspace Cargo.toml (zstd = "0.13.3"), external to this repo.
    # None of the three flaws are reachable: `journal/frame.rs` only ever
    # calls `zstd::bulk::compress`/`bulk::Decompressor::decompress` with an
    # explicit output size, resetting its context before each frame. All
    # three advisories are specifically about the *streaming* encoder/decoder
    # (`with_context` reuse across an abandoned stream; legacy-frame failure
    # in `DCtx::decompress_stream`) or the `seekable` feature — RUSTSEC-2026-0403's
    # own text calls out that the bulk API it is not affected. Revisit once
    # commonware-storage (or whichever fork this workspace's
    # `iverc/commonware-upstream` patch tracks) bumps zstd/zstd-safe.
    "RUSTSEC-2026-0391", # with_context stream reuse leaks data across streams
    "RUSTSEC-2026-0398", # Seekable::decompress Vec::set_len past capacity
    "RUSTSEC-2026-0403", # legacy-frame decompress failure exposes uninitialized memory
]

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
# Warn on duplicate versions of the same crate (common with large dep trees)
multiple-versions = "warn"
wildcards = "allow"

# ---------------------------------------------------------------------------
# Source origins
# ---------------------------------------------------------------------------
[sources]
# Only allow crates.io and the explicitly pinned integration sources
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

allow-git = [
    "https://github.com/iverc/commonware-upstream",
    "https://github.com/sourcenetwork/backbone.git",
    "https://github.com/sourcenetwork/defradb.rs",
    "https://github.com/sourcenetwork/orbis-rs",
    "https://github.com/sourcenetwork/regolith.git",
    "https://github.com/sourcenetwork/vera.rs",
]
