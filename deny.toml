# cargo-deny configuration
# Run: cargo deny check
# Install: cargo install cargo-deny

[graph]
all-features = false

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
# Anything not in the allow list is denied by default.
# OR-expressions are evaluated lazily — if Apache-2.0 or MIT appears in the
# expression, the crate passes even if GPL also appears (e.g. self_cell).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",   # Boost Software License (permissive) — used by ryu via serde_json
    "MPL-2.0",   # file-level copyleft only; we don't modify these files.
                 # affects: attohttpc (via iroh→igd-next), option-ext (via dirs)
]

# Confidence threshold for license text scanning (when SPDX field is absent)
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Security advisories — disabled until prod-ready
# ---------------------------------------------------------------------------
[advisories]
unmaintained = "none"
yanked = "allow"
ignore = [
    # did-key 0.2.1 is the latest did-key release and still depends on
    # ed25519-dalek 1.x / curve25519-dalek 3.x. We only accept EdDSA did:key
    # tokens and no patched did-key upgrade is available yet.
    "RUSTSEC-2022-0093",
    "RUSTSEC-2024-0344",

    # iroh 0.95.1 is the current API used by network/orbis-node and pins
    # hickory-proto 0.25.x. Revisit when moving to a newer iroh line.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",

    # tendermint-rpc 0.40.4 is the latest tendermint-rpc release and its
    # http-client feature still pins reqwest 0.11 / rustls-webpki 0.101.x.
    # We removed its websocket-client feature and use reqwest 0.12 elsewhere.
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
    # h2 0.3.27, pulled in transitively by the same pinned reqwest 0.11 /
    # hyper 0.14 stack above (via tendermint-rpc's http-client feature) — no
    # patched 0.3.x release exists (fix landed only in 0.4.16, already picked
    # up by the newer h2 0.4.x line reqwest 0.12 resolves to elsewhere). Low
    # severity (unbounded empty DATA frames from a malicious peer). Revisit
    # alongside the other tendermint-rpc entries above.
    "RUSTSEC-2026-0258",
]

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
# Warn on duplicate versions of the same crate (common with large dep trees)
multiple-versions = "warn"
wildcards = "allow"

# ---------------------------------------------------------------------------
# Source origins
# ---------------------------------------------------------------------------
[sources]
# Only allow crates from crates.io and local path dependencies
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
