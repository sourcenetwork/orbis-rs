# cargo-deny configuration
# Run: cargo deny check
# Install: cargo install cargo-deny

[graph]
all-features = false

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
# Anything not in the allow list is denied by default.
# OR-expressions are evaluated lazily — if Apache-2.0 or MIT appears in the
# expression, the crate passes even if GPL also appears (e.g. self_cell).
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",   # Boost Software License (permissive) — used by ryu via serde_json
    "MPL-2.0",   # file-level copyleft only; we don't modify these files.
                 # affects: attohttpc (via iroh→igd-next), option-ext (via dirs)
]

# Confidence threshold for license text scanning (when SPDX field is absent)
confidence-threshold = 0.8
exceptions = [
    { name = "orbis-reporting", version = "=0.0.3", allow = ["BUSL-1.1"] },
]

# ---------------------------------------------------------------------------
# Security advisories
# ---------------------------------------------------------------------------
[advisories]
unmaintained = "none"
yanked = "allow"
ignore = [
    # Timing side-channel in crypto-bigint's constant-time arithmetic
    # (subtraction, Montgomery multiplication, etc). Reached via cosmrs
    # 0.22.0 (the latest published version — confirmed no 0.23+ exists) ->
    # ecdsa 0.16.9 -> elliptic-curve 0.13.8 -> crypto-bigint 0.5.5, on the
    # real Cosmos tx-signing path, not just test code. No fix is possible
    # without cosmrs/cosmos-rust itself bumping its elliptic-curve
    # dependency (`cargo update -p crypto-bigint` refuses: nothing in our
    # own dependency graph allows crossing the 0.5->0.7 major bump).
    # Exploitability requires an attacker able to observe timing/
    # microarchitectural side channels on the signing operation itself —
    # narrow, but not nothing. Revisit when cosmrs publishes a version
    # pulling crypto-bigint >=0.7.6.
    "RUSTSEC-2026-0387",
]

# ---------------------------------------------------------------------------
# Banned crates
# ---------------------------------------------------------------------------
[bans]
# Reject TLS versions older than the patched release.
deny = [
    { name = "rustls", version = "<0.23.46" },
]
# Warn on duplicate versions of the same crate (common with large dep trees)
multiple-versions = "warn"
wildcards = "allow"

# ---------------------------------------------------------------------------
# Source origins
# ---------------------------------------------------------------------------
[sources]
# Only allow crates.io and the explicitly pinned integration sources
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

allow-git = [
    # Root Cargo.toml's `[patch.crates-io]` section pins all `commonware-*`
    # crates straight to upstream at a specific rev (not a fork) — this
    # entry replaces a stale `iverc/commonware-upstream` fork URL that no
    # longer matches what's actually patched.
    "https://github.com/commonwarexyz/monorepo",
    "https://github.com/sourcenetwork/backbone.git",
    "https://github.com/sourcenetwork/defradb.rs",
    "https://github.com/sourcenetwork/orbis-rs",
    "https://github.com/sourcenetwork/regolith.git",
    "https://github.com/sourcenetwork/vera.rs",
]
