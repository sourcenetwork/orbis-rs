# Docker Compose for integration tests
# Spins up sourcehub chain + 3 orbis nodes with proper dependencies and healthchecks
#
# To test a specific crypto implementation, set ORBIS_INTEGRATION_CRYPTO before
# bringing the stack up (and use --build so images are built with that feature):
#   ORBIS_INTEGRATION_CRYPTO=bls12-381  docker compose -f docker/docker-compose-integration-test.yml up --build -d
#   ORBIS_INTEGRATION_CRYPTO=decaf377   docker compose -f docker/docker-compose-integration-test.yml up --build -d
# Default is bls12-381 when unset.
# Fixed ORBIS_PASSWORD and ORBIS_SECRET_KEY values in this file are local-test
# fixtures only. Production deployments should inject secrets from a secret
# manager or read-only mounted files; see bin/orbis-node/README.md.
services:
  sourcehub:
    build:
      context: .
      dockerfile: Dockerfile.sourcehub-integration
    container_name: sourcehub-integration-test
    entrypoint: ["/bin/sh", "-c"]
    volumes:
      - ${GENESIS_PATCH_FILE:-/dev/null}:/tmp/genesis-patch.json:ro
    command:
      - |
        rm -rf /home/node/.sourcehub/*
        sourcehubd init local-node --chain-id sourcehub-localnet --home /home/node/.sourcehub
        sourcehubd keys add validator --keyring-backend test --home /home/node/.sourcehub
        echo "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" | sourcehubd keys add test --recover --keyring-backend test --home /home/node/.sourcehub
        sourcehubd genesis add-genesis-account validator 100000000000uopen --keyring-backend test --home /home/node/.sourcehub
        sourcehubd genesis add-genesis-account test 100000000000uopen --keyring-backend test --home /home/node/.sourcehub
        sourcehubd genesis gentx validator 10000000000uopen --keyring-backend test --chain-id sourcehub-localnet --home /home/node/.sourcehub
        sourcehubd genesis collect-gentxs --home /home/node/.sourcehub
        if [ -s /tmp/genesis-patch.json ]; then
          jq --argjson patch "$$(cat /tmp/genesis-patch.json)" '.app_state *= $$patch' \
            /home/node/.sourcehub/config/genesis.json > /tmp/patched-genesis.json \
            && mv /tmp/patched-genesis.json /home/node/.sourcehub/config/genesis.json
          echo "Applied genesis patch"
        fi
        exec sourcehubd start --home /home/node/.sourcehub --rpc.laddr tcp://0.0.0.0:26657 --api.enable --api.address tcp://0.0.0.0:1317
    ports:
      - "26657:26657" # RPC
      - "26656:26656" # P2P
      - "1317:1317"   # API
      - "9090:9090"   # gRPC
    networks:
      - orbis-integration-network
    healthcheck:
      test: ["CMD", "sourcehubd", "status", "--home", "/home/node/.sourcehub"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ENABLE_INTEGRATION_TEST: "true"
        CRYPTO_FEATURE: "${ORBIS_INTEGRATION_CRYPTO:-bls12-381}"
    container_name: orbis-integration-node-1
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret1testsecret1
      - RUST_LOG=debug
    command: ["--addr", "0.0.0.0:50051", "--log-level", "debug", "--authz-grpc", "http://sourcehub:9090", "--bulletin-grpc", "http://sourcehub:9090", "--chain-rpc", "http://sourcehub:26657", "--chain-rest", "http://sourcehub:1317", "--metrics-addr", "0.0.0.0:9090", "--reshare-interval-secs", "5", "--node-controller-key", "024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62"]
    ports:
      - "50051:50051"
      - "9091:9090"
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ENABLE_INTEGRATION_TEST: "true"
        CRYPTO_FEATURE: "${ORBIS_INTEGRATION_CRYPTO:-bls12-381}"
    container_name: orbis-integration-node-2
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret2testsecret2
      - RUST_LOG=debug
    command: ["--addr", "0.0.0.0:50051", "--log-level", "debug", "--authz-grpc", "http://sourcehub:9090", "--bulletin-grpc", "http://sourcehub:9090", "--chain-rpc", "http://sourcehub:26657", "--chain-rest", "http://sourcehub:1317", "--metrics-addr", "0.0.0.0:9090", "--reshare-interval-secs", "5", "--node-controller-key", "024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62"]
    ports:
      - "50052:50051"
      - "9092:9090"
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ENABLE_INTEGRATION_TEST: "true"
        CRYPTO_FEATURE: "${ORBIS_INTEGRATION_CRYPTO:-bls12-381}"
    container_name: orbis-integration-node-3
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret3testsecret3
      - RUST_LOG=debug
    command: ["--addr", "0.0.0.0:50051", "--log-level", "debug", "--authz-grpc", "http://sourcehub:9090", "--bulletin-grpc", "http://sourcehub:9090", "--chain-rpc", "http://sourcehub:26657", "--chain-rest", "http://sourcehub:1317", "--metrics-addr", "0.0.0.0:9090", "--reshare-interval-secs", "5", "--node-controller-key", "024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62"]
    ports:
      - "50053:50051"
      - "9093:9090"
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

networks:
  orbis-integration-network:
    driver: bridge
