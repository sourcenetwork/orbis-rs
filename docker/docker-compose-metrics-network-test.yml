# Docker Compose for integration tests
# Spins up sourcehub chain + 3 orbis nodes with proper dependencies and healthchecks
services:
  sourcehub:
    build:
      context: https://github.com/sourcenetwork/sourcehub.git#jesse/Orbis-module
    entrypoint: ["/bin/sh", "-c"]
    container_name: sourcehub-integration-test
    command:
      - |
        rm -rf /home/node/.sourcehub/*
        sourcehubd init local-node --chain-id sourcehub-localnet --home /home/node/.sourcehub
        sourcehubd keys add validator --keyring-backend test --home /home/node/.sourcehub
        # Add a test account with known mnemonic for integration testing
        echo "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" | sourcehubd keys add test --recover --keyring-backend test --home /home/node/.sourcehub
        sourcehubd genesis add-genesis-account validator 100000000000uopen --keyring-backend test --home /home/node/.sourcehub
        sourcehubd genesis add-genesis-account test 100000000000uopen --keyring-backend test --home /home/node/.sourcehub
        sourcehubd genesis gentx validator 10000000000uopen --keyring-backend test --chain-id sourcehub-localnet --home /home/node/.sourcehub
        sourcehubd genesis collect-gentxs --home /home/node/.sourcehub
        exec sourcehubd start --home /home/node/.sourcehub --rpc.laddr tcp://0.0.0.0:26657 --api.enable --api.address tcp://0.0.0.0:1317
    ports:
      - "26657:26657" # RPC
      - "26656:26656" # P2P
      - "1317:1317"   # API
      - "9090:9090"   # gRPC
    networks:
      - orbis-integration-network
    healthcheck:
      test: ["CMD", "sourcehubd", "status", "--home", "/home/node/.sourcehub"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ENABLE_INTEGRATION_TEST: "true"
    container_name: orbis-integration-node-1
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret1testsecret1
      - RUST_LOG=info
    command: ["--addr", "0.0.0.0:50051", "--log-level", "info", "--authz-grpc", "http://sourcehub:9090", "--bulletin-grpc", "http://sourcehub:9090", "--chain-rpc", "http://sourcehub:26657", "--chain-rest", "http://sourcehub:1317", "--metrics-addr", "0.0.0.0:9090", "--loki-url", "http://loki:3100", "--node-controller-key", "024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62", "--node-whitelisted-namespace", "orbis"]
    ports:
      - "50051:50051"
      - "9091:9090"
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ENABLE_INTEGRATION_TEST: "true"
    container_name: orbis-integration-node-2
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret2testsecret2
      - RUST_LOG=info
    command: ["--addr", "0.0.0.0:50051", "--log-level", "info", "--authz-grpc", "http://sourcehub:9090", "--bulletin-grpc", "http://sourcehub:9090", "--chain-rpc", "http://sourcehub:26657", "--chain-rest", "http://sourcehub:1317", "--metrics-addr", "0.0.0.0:9090", "--loki-url", "http://loki:3100", "--node-controller-key", "024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62", "--node-whitelisted-namespace", "orbis"]
    ports:
      - "50052:50051"
      - "9092:9090"
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ENABLE_INTEGRATION_TEST: "true"
    container_name: orbis-integration-node-3
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret3testsecret3
      - RUST_LOG=info
    command: ["--addr", "0.0.0.0:50051", "--log-level", "info", "--authz-grpc", "http://sourcehub:9090", "--bulletin-grpc", "http://sourcehub:9090", "--chain-rpc", "http://sourcehub:26657", "--chain-rest", "http://sourcehub:1317", "--metrics-addr", "0.0.0.0:9090", "--loki-url", "http://loki:3100", "--node-controller-key", "024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62", "--node-whitelisted-namespace", "orbis"]
    ports:
      - "50053:50051"
      - "9093:9090"
    networks:
      - orbis-integration-network
    depends_on:
      sourcehub:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml
    networks:
      - orbis-integration-network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9099:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - orbis-integration-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    networks:
      - orbis-integration-network

networks:
  orbis-integration-network:
    driver: bridge
