        ipv4_address: ${ORBIS_NATIVE_VERA4_IP}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8645 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node1:
    user: "${ORBIS_NATIVE_NODE1_USER:-0:0}"
    image: ${ORBIS_NATIVE_IMAGE:-orbis-node-native:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        BACKEND: native
        ENABLE_INTEGRATION_TEST: "${ORBIS_BUILD_INTEGRATION_TEST:-true}"
        CRYPTO_FEATURE: "${ORBIS_INTEGRATION_CRYPTO:-bls12-381}"
        # docker/Dockerfile defaults to the floating `rust:latest` tag, whose
        # glibc can be newer than the `debian:bookworm-slim` runtime stage's —
        # on at least ARM64 hosts this makes the built orbis-node binary
        # unable to execute in its own runtime image ("GLIBC_2.38 not
        # found"). CI's `image` job already pins this exact tag for the
        # native backend for the same reason (.github/workflows/rust.yml);
        # this applies the same pin here so local/native_workflow.rs-driven
        # runs don't hit it too.
        RUST_IMAGE: "${ORBIS_NATIVE_RUST_IMAGE:-rust:1.98.0-bookworm}"
    working_dir: /data
    environment:
      - ORBIS_PASSWORD_FILE=password
      - RUST_LOG=info
      # Compiled in by default (BACKEND=native always adds unsafe-testing when
      # ENABLE_INTEGRATION_TEST=true at build time, above) but disabled at
      # runtime unless a caller opts in — same opt-in gate Cosmos's own
      # compose file uses, see `production_docker_nodes_do_not_expose_unsafe_testing_service`.
      - ORBIS_ENABLE_INTEGRATION_TEST=${ORBIS_NATIVE_ENABLE_UNSAFE_TESTING:-false}
    # `${ORBIS_NATIVE_RESHARE_INTERVAL:-5}`: `NativeNetworkAdapter`'s plain
    # bring-up (no scenario wiring) doesn't care about this value and leaves
    # it at the default; `native_workflow.rs`'s scenario-driven bring-up sets
    # it to `1` to match pre-migration behavior (`Node::start_configured`'s
    # old hardcoded `--reshare-interval-secs 1`).
    command: ["--vera-config", "/data/vera.json", "--addr", "0.0.0.0:50051", "--node-controller-key", "02466d7fcae563e5cb09a0d1870bb580344804617879a14949cf22285f1bae3f27", "--network-private-routes-only", "--network-bind-addr", "0.0.0.0:9001", "--reshare-interval-secs", "${ORBIS_NATIVE_RESHARE_INTERVAL:-5}", "--runtime-base-path", "/data"]
    volumes:
      - ${ORBIS_NATIVE_NODE1_DIR:-/dev/null}:/data
    ports:
      - "127.0.0.1::50051"
    networks:
      orbis-native-integration-network:
        ipv4_address: ${ORBIS_NATIVE_NODE1_IP}
    depends_on:
      vera1:
        condition: service_healthy
      vera2:
        condition: service_healthy
      vera3:
        condition: service_healthy
      vera4:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

