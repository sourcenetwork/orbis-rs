    command: ["--vera-config", "/data/vera.json", "--addr", "0.0.0.0:50051", "--node-controller-key", "02466d7fcae563e5cb09a0d1870bb580344804617879a14949cf22285f1bae3f27", "--network-private-routes-only", "--network-bind-addr", "0.0.0.0:9001", "--reshare-interval-secs", "${ORBIS_NATIVE_RESHARE_INTERVAL:-5}", "--runtime-base-path", "/data"]
