        condition: service_healthy
      vera2:
        condition: service_healthy
      vera3:
        condition: service_healthy
      vera4:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  node3:
    user: "${ORBIS_VERA_NODE3_USER:-0:0}"
    image: ${ORBIS_VERA_NODE_IMAGE:-orbis-node-vera:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ENABLE_INTEGRATION_TEST: "${ORBIS_BUILD_INTEGRATION_TEST:-true}"
        CRYPTO_FEATURE: "${ORBIS_INTEGRATION_CRYPTO:-bls12-381}"
        # docker/Dockerfile defaults to the floating `rust:latest` tag, whose
