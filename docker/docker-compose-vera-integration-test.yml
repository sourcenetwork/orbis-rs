        condition: service_healthy
      vera2:
        condition: service_healthy
      vera3:
        condition: service_healthy
      vera4:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Defra-backed PRE share storage (ring `pre_share_endpoints`). Opt-in: only
  # brought up when `VeraNetworkAdapter::start_configured`'s `defra` flag
  # is set, which adds it to the explicit `docker compose up -d` service
  # list — there is no profile gate, since every service in this file is
  # named explicitly.
  defra:
    image: ${DEFRA_INTEGRATION_IMAGE:-orbis-defra-integration:local}
    build:
      context: .
      dockerfile: Dockerfile.defra-integration
      args:
        DEFRA_REF: ${DEFRA_REF:-main}
    # `--workers 2 --worker-priority nice:10`: defra's default (`--workers
    # auto`, one worker per core, at a `SCHED_RR 50` real-time priority) is
    # sized for real traffic, and starves the sibling orbis node containers'
    # DKG prepare phase badly enough to blow `DKG_PREPARATION_TIMEOUT`.
    command: ["--rootdir", "/data", "--url", "0.0.0.0:9181", "--no-keyring=true", "start", "--store", "memory", "--no-p2p=true", "--workers", "2", "--worker-priority", "nice:10"]
    ports:
      - "127.0.0.1::9181"
    networks:
      orbis-vera-integration-network:
        # Statically assigned (see `host_ip`/`VeraTestNetwork::defra_ip`), so
        # the address is known before this container even starts.
        ipv4_address: ${ORBIS_VERA_DEFRA_IP}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9181/health-check"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

networks:
  # Pre-created by crates/test-support/src/vera_network.rs (plain `docker
  # network create`, letting Docker pick a non-colliding subnet) so validator
  # IPs are known before any container exists — see that file's module doc
  # comment. Compose only joins it; it never creates or removes it.
  orbis-vera-integration-network:
    external: true
    name: ${ORBIS_VERA_NETWORK_NAME}
