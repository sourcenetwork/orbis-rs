# Docker Compose for Vera integration tests
# Spins up a 4-validator Vera devnet + 3 orbis nodes, all on service-name
# networking (no network_mode: host) with health checks.
#
# Every port here is a FIXED container-internal port: each service runs in its
# own network namespace (bridge networking), so there is no shared port space
# to avoid collisions in. Host-side access (for the test process) goes through
# Docker's own ephemeral published-port mapping.
#
# To use the pinned native Vera chain revision:
#   VERA_REF=$(cat docker/VERA_REF) ORBIS_INTEGRATION_CRYPTO=jubjub \
#     docker compose -f docker/docker-compose-vera-integration-test.yml up --build -d
# The test harness reads docker/VERA_REF and sets VERA_REF explicitly.
#
# `ORBIS_VERA{1..4}_DIR` / `ORBIS_VERA_NODE{1..4}_DIR` / `ORBIS_VERA_DEPLOYMENT`
# are set by crates/test-support/src/vera_network.rs before bringing the
# stack up; they point at host directories the driver populates with
# genesis/config/peers (validators) or services.json/password (orbis nodes).
#
# Validators are addressed by IP, not Compose service-name DNS: `verad`'s
# peers.json parses bootstrapper addresses with Rust's strict
# `SocketAddr::parse` (crates/vera-node/src/config.rs's `load_peers`) — no DNS
# resolution, so a hostname there is a hard parse error at validator startup.
# crates/test-support/src/vera_network.rs creates the 4 validator
# containers first (assigning them IPs on Docker's own auto-allocated,
# per-project network — no fixed subnet here, so parallel test runs never
# collide), discovers those IPs, writes genesis.json/peers.json referencing
# them, and only then starts the containers.
services:
  vera1:
    user: "${ORBIS_VERA1_USER:-0:0}"
    image: ${ORBIS_VERA_IMAGE:-orbis-vera:local}
    build:
      context: .
      dockerfile: Dockerfile.vera-integration
      args:
        VERA_REF: ${VERA_REF:?Set VERA_REF from docker/VERA_REF}
    entrypoint: ["verad"]
    working_dir: /data
    command: ["--config", "/data/config.toml", "--data-dir", "/data", "--chain-id", "${ORBIS_VERA_DEPLOYMENT:-9000}", "validator", "--peers", "/data/peers.json", "--rpc-port", "8645", "--leader-timeout-ms", "500", "--notarization-timeout-ms", "1000", "--nullify-retry-ms", "2000"]
    volumes:
      - ${ORBIS_VERA1_DIR:-/dev/null}:/data
    ports:
      - "127.0.0.1::8645"
    networks:
      orbis-vera-integration-network:
        ipv4_address: ${ORBIS_VERA1_IP}
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8645 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  vera2:
    user: "${ORBIS_VERA2_USER:-0:0}"
    image: ${ORBIS_VERA_IMAGE:-orbis-vera:local}
    build:
      context: .
      dockerfile: Dockerfile.vera-integration
      args:
        VERA_REF: ${VERA_REF:?Set VERA_REF from docker/VERA_REF}
    entrypoint: ["verad"]
    working_dir: /data
    command: ["--config", "/data/config.toml", "--data-dir", "/data", "--chain-id", "${ORBIS_VERA_DEPLOYMENT:-9000}", "validator", "--peers", "/data/peers.json", "--rpc-port", "8645", "--leader-timeout-ms", "500", "--notarization-timeout-ms", "1000", "--nullify-retry-ms", "2000"]
    volumes:
