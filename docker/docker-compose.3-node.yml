# Fixed ORBIS_PASSWORD and ORBIS_SECRET_KEY values in this file are local-test
# fixtures only. Production deployments should inject secrets from a secret
# manager or read-only mounted files; see bin/orbis-node/README.md.
services:
  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orbis-node-1
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret1testsecret1
      - RUST_LOG=info
    command: ["--addr", "0.0.0.0:50051", "--log-level", "info", "--authz-grpc", "http://vera:9090", "--bulletin-grpc", "http://vera:9090", "--chain-rpc", "http://vera:26657", "--chain-rest", "http://vera:1317", "--node-controller-key", "024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62"]
    ports:
      - "50051:50051"
    networks:
      - orbis-network

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orbis-node-2
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret2testsecret2
      - RUST_LOG=info
    command: ["--addr", "0.0.0.0:50051", "--log-level", "info", "--authz-grpc", "http://vera:9090", "--bulletin-grpc", "http://vera:9090", "--chain-rpc", "http://vera:26657", "--chain-rest", "http://vera:1317", "--node-controller-key", "024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62"]
    ports:
      - "50052:50051"
    networks:
      - orbis-network

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orbis-node-3
    environment:
      - ORBIS_PASSWORD=testpassword123
      - ORBIS_SECRET_KEY=testsecret3testsecret3
      - RUST_LOG=info
    command: ["--addr", "0.0.0.0:50051", "--log-level", "info", "--authz-grpc", "http://vera:9090", "--bulletin-grpc", "http://vera:9090", "--chain-rpc", "http://vera:26657", "--chain-rest", "http://vera:1317", "--node-controller-key", "024f4e2ad99c34d60b9ba6283c9431a8418af8673212961f97a77b6377fcd05b62"]
    ports:
      - "50053:50051"
    networks:
      - orbis-network

  vera:
    build:
      context: https://github.com/sourcenetwork/vera.git#jesse/update-orbis
    volumes:
      - vera-data:/home/node/.vera
    entrypoint: ["/bin/sh", "-c"]
    networks:
      - orbis-network
    command:
      - |
        rm -rf /home/node/.vera/*
        verad init local-node --chain-id vera-localnet --home /home/node/.vera
        verad keys add validator --keyring-backend test --home /home/node/.vera
        # Add a test account with known mnemonic for CLI tool funding
        echo "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about" | verad keys add test --recover --keyring-backend test --home /home/node/.vera
        verad genesis add-genesis-account validator 100000000000uopen --keyring-backend test --home /home/node/.vera
        verad genesis add-genesis-account test 100000000000uopen --keyring-backend test --home /home/node/.vera
        verad genesis gentx validator 10000000000uopen --keyring-backend test --chain-id vera-localnet --home /home/node/.vera
        verad genesis collect-gentxs --home /home/node/.vera
        exec verad start --home /home/node/.vera --rpc.laddr tcp://0.0.0.0:26657 --api.enable --api.address tcp://0.0.0.0:1317
    ports:
      - "26657:26657" # RPC
      - "26656:26656" # P2P
      - "1317:1317" # API
      - "4500:4500"

networks:
  orbis-network:
    driver: bridge

volumes:
  vera-data:
